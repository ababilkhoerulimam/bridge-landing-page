<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BRIDGE - Owner Dashboard</title>
  
  <!-- Google Fonts & Icon Libraries -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- React & Babel Dev Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- jsPDF CDN for Report Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-body:#eef2f9; 
      --bg-gradient:radial-gradient(circle at 20% 30%, #ffffff, #d7e3f5 70%);
      --glass-bg:rgba(255,255,255,0.65); 
      --glass-border:rgba(15,23,42,0.08); 
      --glass-blur:blur(18px);
      --primary-gradient:linear-gradient(145deg, #030b85, #1a3ba8);
      --text-gradient:linear-gradient(to right,#1e293b,#030b85);
      --text-primary:#0f172a; 
      --text-muted:#1e293b; 
      --text-secondary:#0f172a;
      --radius-card:1.5rem; 
      --shadow-card:0 25px 50px rgba(30,41,59,0.1);
      --shadow-btn:0 8px 28px rgba(3,11,133,0.3);
      --transition:0.25s ease;
      --sidebar-width:260px;
    }
    
    html, body, #root { height:100%; }
    
    body { 
      font-family:'Plus Jakarta Sans',sans-serif; 
      background:var(--bg-body); 
      background-image:var(--bg-gradient); 
      min-height:100vh; 
      padding:20px; 
      color:var(--text-primary); 
      display:flex; 
      align-items:stretch;
      justify-content:center;
    }
    
    #root { 
      max-width:1440px; 
      width:100%; 
      margin:0 auto; 
      min-height:calc(100vh - 40px);
      display:flex;
      align-items:stretch;
    }
    
    .app-layout { 
      display:flex; 
      gap:1.5rem; 
      width:100%;
      min-height:calc(100vh - 40px);
      align-items:stretch;
    }
    
    /* Sidebar Navigation */
    .sidebar { 
      width:var(--sidebar-width); 
      flex-shrink:0; 
      background:var(--glass-bg); 
      backdrop-filter:var(--glass-blur); 
      -webkit-backdrop-filter:var(--glass-blur); 
      border:1px solid var(--glass-border); 
      border-radius:var(--radius-card); 
      box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.8); 
      padding:1.5rem 1rem; 
      display:flex; 
      flex-direction:column; 
      height:calc(100vh - 40px);
      position:sticky; 
      top:20px; 
      transition:var(--transition);
      overflow-y:auto;
    }
    
    .sidebar:hover { box-shadow:0 30px 60px rgba(30,41,59,0.12); }
    
    .sidebar-brand { 
      display:flex; 
      align-items:center; 
      gap:0.75rem; 
      padding-bottom:1.5rem; 
      border-bottom:1px solid rgba(15,23,42,0.08); 
      margin-bottom:1.5rem; 
      flex-shrink:0; 
    }
    
    .sidebar-brand img { height:28px; width:auto; }
    
    .sidebar-brand span { 
      font-size:1.3rem; 
      font-weight:800; 
      background:var(--text-gradient); 
      -webkit-background-clip:text; 
      -webkit-text-fill-color:transparent; 
      background-clip:text; 
      font-family: 'Outfit', sans-serif;
    }
    
    .sidebar-menu { display:flex; flex-direction:column; gap:0.25rem; flex:1; overflow-y:auto; }
    
    .sidebar-menu .menu-item { 
      display:flex; 
      align-items:center; 
      gap:0.75rem; 
      padding:0.55rem 0.8rem; 
      border-radius:0.8rem; 
      color:var(--text-secondary); 
      cursor:pointer; 
      transition:var(--transition); 
      font-size:0.8rem; 
      font-weight:600; 
      border:1px solid transparent; 
    }
    
    .sidebar-menu .menu-item:hover { background:rgba(15, 23, 42, 0.04); color:#1e293b; }
    
    .sidebar-menu .menu-item.active { 
      background:rgba(3, 11, 133, 0.1); 
      color:#030b85; 
      border-color:rgba(3, 11, 133, 0.25); 
    }
    
    .sidebar-menu .menu-item i { width:1.2rem; text-align:center; font-size:0.95rem; }
    
    .sidebar-footer { 
      margin-top:auto; padding-top:1rem; 
      border-top:1px solid rgba(15,23,42,0.08); 
      font-size:0.75rem; color:var(--text-secondary); text-align:center; 
      flex-shrink:0;
    }

    .sidebar-footer .logout-btn { 
      width:100%; padding:0.5rem 0.8rem; 
      border:1px solid rgba(15,23,42,0.15); border-radius:0.8rem; 
      background:transparent; color:var(--text-secondary); 
      cursor:pointer; transition:var(--transition); 
      font-family:inherit; font-size:0.75rem; 
      display:flex; align-items:center; justify-content:center; gap:0.4rem; 
      margin-top:0.6rem; 
      font-weight:700;
    }
    .sidebar-footer .logout-btn:hover { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.3); color:#dc2626; }
    
    /* Content Area */
    .main-content { 
      flex:1; 
      min-width:0; 
      overflow-y:auto; 
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .main-content::-webkit-scrollbar { display: none; }
    
    .glass-card { 
      background:var(--glass-bg); 
      backdrop-filter:var(--glass-blur); 
      -webkit-backdrop-filter:var(--glass-blur); 
      border:1px solid var(--glass-border); 
      border-radius:var(--radius-card); 
      box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,0.8); 
      padding:1.5rem; 
      transition:transform var(--transition), box-shadow var(--transition); 
      margin-bottom:1.5rem; 
    }
    
    .glass-card:hover { box-shadow:0 30px 60px rgba(30,41,59,0.12); }
    
    .page-title { 
      font-size:1.5rem; 
      font-weight:700; 
      margin-bottom:1.5rem; 
      background:var(--text-gradient); 
      -webkit-background-clip:text; 
      -webkit-text-fill-color:transparent; 
      background-clip:text; 
      display:flex; 
      align-items:center; 
      gap:0.75rem; 
      font-family: 'Outfit', sans-serif;
    }
    
    .metrics-grid { 
      display:grid; 
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); 
      gap:1rem; 
      margin-bottom:1.5rem; 
    }
    
    .metric-card { 
      background:rgba(255,255,255,0.45); 
      border:1px solid rgba(15,23,42,0.08); 
      border-radius:1rem; 
      padding:1.1rem 1.3rem; 
      text-align:center; 
      transition:var(--transition); 
    }
    
    .metric-card:hover { background:rgba(15,23,42,0.04); }
    .metric-label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary); font-weight:700; }
    .metric-value { font-size:1.6rem; font-weight:800; margin:0.2rem 0 0.1rem; color:#1e293b; font-family: 'Outfit', sans-serif; }
    .metric-trend { font-size:0.8rem; display:inline-flex; align-items:center; gap:0.2rem; font-weight:700; }
    .metric-trend.up { color:#059669; } .metric-trend.down { color:#dc2626; }
    
    .bdri-section { display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; background:rgba(255,255,255,0.45); border-radius:1rem; padding:1rem 1.5rem; border:1px solid rgba(15,23,42,0.08); margin-bottom:1.5rem; }
    .bdri-bar-wrap { flex:1; min-width:150px; height:12px; background:rgba(15,23,42,0.1); border-radius:20px; overflow:hidden; }
    .bdri-bar-fill { height:100%; width:0%; border-radius:20px; background:var(--primary-gradient); transition:width 0.6s ease; }
    .phase3-badge { 
      background:#030b85; 
      color:#fff; 
      padding:0.2rem 1rem; 
      border-radius:2rem; 
      font-weight:700; 
      font-size:0.8rem; 
      letter-spacing:0.05em; 
      text-transform:uppercase;
    }

    .charts-row { 
      display:grid; 
      grid-template-columns:1fr 1fr; 
      gap:1.5rem; 
      margin-bottom:1.5rem; 
    }
    
    .chart-box { 
      background:rgba(255,255,255,0.4); 
      border-radius:1rem; 
      padding:1.2rem; 
      border:1px solid rgba(15,23,42,0.08); 
    }
    
    .chart-box h3 { font-size:0.9rem; font-weight:700; margin-bottom:0.8rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.02em; }
    .chart-box canvas { max-height:220px; max-width:100%; }
    
    /* Tables */
    .table-wrap { overflow-x:auto; }
    
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    
    th { text-align:left; padding:0.75rem 0.9rem; color:#030b85; font-weight:700; background:rgba(3,11,133,0.04); border-bottom:2px solid rgba(15,23,42,0.08); }
    
    td { padding:0.7rem 0.9rem; border-bottom:1px solid rgba(15,23,42,0.06); color:#1e293b; }
    
    tr:hover td { background:rgba(15, 23, 42, 0.03); }
    
    .status-normal { color:#059669; font-weight:700; } 
    .status-anomali { color:#dc2626; font-weight:700; } 
    
    .kiln-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
    
    .kiln-status-badge { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; box-shadow: 0 0 8px currentColor; }
    .kiln-status-badge.green { background-color:#059669; color:#059669; } 
    .kiln-status-badge.yellow { background-color:#d97706; color:#d97706; } 
    .kiln-status-badge.red { background-color:#dc2626; color:#dc2626; }

    /* Action Buttons */
    .predict-btn {
      padding: 0.7rem 2rem;
      border: none;
      border-radius: 3rem;
      background: var(--primary-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-btn);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .predict-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(3,11,133,0.45);
    }
    .predict-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .action-btn {
      padding: 0.45rem 1rem;
      border: 1px solid rgba(15, 23, 42, 0.15);
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--text-primary);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .action-btn:hover {
      background: rgba(15, 23, 42, 0.05);
    }

    .action-btn.reset {
      color: #dc2626;
      border-color: rgba(220, 38, 38, 0.2);
      background: rgba(220, 38, 38, 0.05);
    }

    .action-btn.reset:hover {
      background: #dc2626;
      color: #fff;
    }

    /* Simulation Sliders */
    .simulator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-top: 0.5rem;
    }

    .slider-card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(15,23,42,0.1);
      border-radius: 5px;
      outline: none;
      cursor: pointer;
    }

    .decision-container {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(3, 11, 133, 0.12);
      border-radius: 1rem;
      padding: 1.3rem;
      margin-top: 1rem;
    }

    .decision-header {
      font-size: 0.95rem;
      font-weight: 800;
      color: #030b85;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(15,23,42,0.08);
      padding-bottom: 0.6rem;
      margin-bottom: 1rem;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 0.8rem;
    }

    .decision-field {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .decision-field-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .decision-field-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Badge achievements */
    .badge-achievement {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(3, 11, 133, 0.08);
      color: #030b85;
      border: 1px solid rgba(3, 11, 133, 0.15);
    }

    .badge-achievement.locked {
      background: rgba(15,23,42,0.03);
      color: var(--text-muted);
      border-color: transparent;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: #10b981;
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 1000;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .reset-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      color: #1e293b;
    }

    /* Modals */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(15,23,42,0.4); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; z-index:999;
    }
    .modal-content {
      background:#ffffff; backdrop-filter:var(--glass-blur); border:1px solid rgba(15,23,42,0.12);
      border-radius:var(--radius-card); padding:2rem; max-width:520px; width:90%;
      box-shadow:0 30px 60px rgba(30,41,59,0.25); max-height:90vh; overflow-y:auto;
    }
    .modal-content h3 { margin-bottom:1rem; color:#1e293b; }
    .modal-content .close-btn {
      float:right; background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text-muted);
    }
    .modal-content .close-btn:hover { color:#1e293b; }
    .modal-content .detail-row { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid rgba(15,23,42,0.06); }
    .modal-content .detail-row strong { color:#030b85; }

    .grade-select {
      padding:0.3rem 1rem;
      border-radius:2rem;
      border:1px solid rgba(15,23,42,0.12);
      background:rgba(255,255,255,0.6);
      font-family:inherit;
      font-size:0.8rem;
      color:#1e293b;
      outline:none;
      cursor:pointer;
    }

    .login-wrap { min-height:calc(100vh - 40px); display:flex; align-items:center; justify-content:center; width:100%; }
    .login-card { max-width:400px; width:100%; }
    .login-input { width:100%; padding:0.9rem 1.2rem; background:rgba(255,255,255,0.6); border:1px solid rgba(15,23,42,0.12); border-radius:2rem; font-size:1rem; color:#1e293b; outline:none; font-family:inherit; transition:var(--transition); }
    .login-input:focus { border-color:rgba(3,11,133,0.5); box-shadow:0 0 0 3px rgba(3,11,133,0.15); }
    .login-input.input-error { border-color:#ef4444; box-shadow:0 0 0 3px rgba(239,68,68,0.15); }
    .login-select { width:100%; padding:0.9rem 1rem; background:rgba(255,255,255,0.6); border:1px solid rgba(15,23,42,0.12); border-radius:2rem; font-size:1rem; color:#1e293b; outline:none; font-family:inherit; appearance:none; cursor:pointer; }
    select option { background:#ffffff !important; color:#1e293b !important; }
    .login-btn { width:100%; padding:0.9rem; border:none; border-radius:3rem; font-size:1rem; font-weight:600; color:#fff; background:var(--primary-gradient); box-shadow:var(--shadow-btn); cursor:pointer; transition:var(--transition); font-family:inherit; display:flex; align-items:center; justify-content:center; gap:0.5rem; }
    .login-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .animate-in { animation:fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes fadeInUp { from{opacity:0; transform:translateY(30px) scale(0.97);} to{opacity:1; transform:translateY(0) scale(1);} }
    .shake { animation:shake 0.4s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(5px);} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    const DUMMY_KILNS = [
      { machine: "Machine 1", temperature: 1150, status: "normal" },
      { machine: "Machine 2", temperature: 1080, status: "normal" },
      { machine: "Machine 3", temperature: 1250, status: "normal" }
    ];

    const formatRupiah = (val) => "Rp " + new Intl.NumberFormat('id-ID').format(val);

    // ---------- TOAST COMPONENT ----------
    const Toast = ({ message, visible, onHide }) => {
      useEffect(() => {
        if (visible) {
          const timer = setTimeout(onHide, 3000);
          return () => clearTimeout(timer);
        }
      }, [visible, onHide]);

      if (!visible) return null;
      return (
        <div className="toast">
          <i className="fas fa-circle-check"></i>
          <span>{message}</span>
        </div>
      );
    };

    // ---------- REUSABLE CHART COMPONENT ----------
    const ChartComponent = ({ type, data, options }) => {
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          chartInstanceRef.current = new Chart(ctx, {
            type,
            data,
            options
          });
        }

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
            chartInstanceRef.current = null;
          }
        };
      }, [type, data, options]);

      return (
        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0 }}>
          <canvas ref={canvasRef} style={{ width: '100%', height: '100%', display: 'block' }}></canvas>
        </div>
      );
    };

    // ---------- SYNC BADGE ----------
    const SyncIndicator = ({ syncState, timestamp }) => {
      let icon = "fa-cloud";
      let label = "Koneksi Aman";
      let color = "var(--text-muted)";

      if (syncState === "syncing") {
          icon = "fa-sync fa-spin";
          label = "Mengambil Data...";
          color = "#030b85";
      } else if (syncState === "success") {
          icon = "fa-circle-check";
          label = `Sinkron Terakhir: ${timestamp || "Baru saja"}`;
          color = "#059669";
      } else if (syncState === "error") {
          icon = "fa-triangle-exclamation";
          label = "Gagal Sinkronisasi";
          color = "#dc2626";
      }

      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: '5px', fontSize: '0.72rem', color: color, fontWeight: 600 }}>
          <i className={`fas ${icon}`}></i>
          <span>{label}</span>
        </div>
      );
    };

    // ---------- DASHBOARD PAGE ----------
    const DashboardPage = ({ financial, quality, operational, kiln, shifts, bdriScore, phase3Unlocked, mandorSubmissions, simulating, toggleFactorySimulation, handleCsvExport }) => {
      const [selectedGradeLine, setSelectedGradeLine] = useState('all');
      const [selectedGradeBar, setSelectedGradeBar] = useState('all');
      const [selectedDiagKiln, setSelectedDiagKiln] = useState(null);
      const [tableSearch, setTableSearch] = useState('');
      const [tableShiftFilter, setTableShiftFilter] = useState('all');
      const [tableQcFilter, setTableQcFilter] = useState('all');
      const [qcModalItem, setQcModalItem] = useState(null);
      const [qcModalReject, setQcModalReject] = useState(2);
      const [qcModalCategory, setQcModalCategory] = useState('Normal');

      const lineData = useMemo(() => shifts.slice(0,30).sort((a,b)=>new Date(a.date)-new Date(b.date)), [shifts]);

      const gradeConfig = {
        grade_a: { label: 'Grade A (%)', color: '#030b85', dataKey: 'grade_a' },
        grade_b: { label: 'Grade B (%)', color: '#f59e0b', dataKey: 'grade_b' },
        grade_c: { label: 'Grade C (%)', color: '#ef4444', dataKey: 'grade_c' },
      };

      const getLineDatasets = () => {
        if (selectedGradeLine === 'all') {
          return [
            { label: 'Grade A (%)', data: lineData.map(d => d.grade_a), borderColor: '#030b85', backgroundColor: 'rgba(3,11,133,0.05)', tension: 0.3, fill: true, pointRadius: 1 },
            { label: 'Grade B (%)', data: lineData.map(d => d.grade_b), borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.05)', tension: 0.3, fill: true, pointRadius: 1 },
            { label: 'Grade C (%)', data: lineData.map(d => d.grade_c), borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.05)', tension: 0.3, fill: true, pointRadius: 1 },
          ];
        } else {
          const cfg = gradeConfig[selectedGradeLine];
          return [{
            label: cfg.label,
            data: lineData.map(d => d[cfg.dataKey]),
            borderColor: cfg.color,
            backgroundColor: cfg.color + '15',
            tension: 0.3,
            fill: true,
            pointRadius: 1,
          }];
        }
      };

      const shiftMap = { Pagi:[], Siang:[], Malam:[] };
      shifts.forEach(s => { 
        if (shiftMap[s.shift]) {
          const key = selectedGradeBar === 'all' ? 'grade_a' : selectedGradeBar;
          shiftMap[s.shift].push(s[key]);
        }
      });
      const shiftAvg = useMemo(() => {
        return Object.keys(shiftMap).map(name => ({ 
          shift: name, 
          avg: shiftMap[name].length ? shiftMap[name].reduce((a,b)=>a+b,0)/shiftMap[name].length : 0 
        }));
      }, [shifts, selectedGradeBar]);

      const getBarDatasets = () => {
        const data = shiftAvg.map(d => d.avg);
        if (selectedGradeBar === 'all') {
          const grades = ['grade_a', 'grade_b', 'grade_c'];
          const labels = ['Grade A', 'Grade B', 'Grade C'];
          const colors = ['#030b85', '#f59e0b', '#ef4444'];
          return labels.map((label, idx) => {
            const key = grades[idx];
            const data = Object.keys(shiftMap).map(shift => {
              const gradeVals = shifts.filter(s => s.shift === shift).map(s => s[key]);
              return gradeVals.length ? gradeVals.reduce((a,b)=>a+b,0)/gradeVals.length : 0;
            });
            return { label, data, backgroundColor: colors[idx], borderRadius: 4 };
          });
        } else {
          const cfg = gradeConfig[selectedGradeBar];
          return [{
            label: cfg.label,
            data: data,
            backgroundColor: cfg.color,
            borderRadius: 4,
          }];
        }
      };

      const lineChartInput = useMemo(() => ({
        labels: lineData.map(d=>d.date.slice(5)),
        datasets: getLineDatasets()
      }), [lineData, selectedGradeLine]);

      const barChartInput = useMemo(() => ({
        labels: Object.keys(shiftMap),
        datasets: getBarDatasets()
      }), [shiftAvg, selectedGradeBar]);

      const lineOptions = { 
        responsive:true, 
        maintainAspectRatio:false, 
        plugins:{ legend:{ labels:{color:'#1e293b'} } }, 
        scales:{ x:{ ticks:{color:'#475569',maxTicksLimit:15} }, y:{ ticks:{color:'#475569'}, min:50, max:100 } } 
      };

      const barOptions = { 
        responsive:true, 
        maintainAspectRatio:false, 
        plugins:{ legend:{ labels:{color:'#1e293b'} } }, 
        scales:{ x:{ ticks:{color:'#475569'} }, y:{ ticks:{color:'#475569'}, min:0, max:100 } } 
      };

      const filteredSubmissions = useMemo(() => {
        return mandorSubmissions.filter(s => {
          const matchSearch = (s.mandor || '').toLowerCase().includes(tableSearch.toLowerCase()) ||
                              (s.name || '').toLowerCase().includes(tableSearch.toLowerCase()) ||
                              (s.notes || '').toLowerCase().includes(tableSearch.toLowerCase());
          const matchShift = tableShiftFilter === 'all' || s.shift === tableShiftFilter;
          const isSigned = !!s.signed;
          const matchQc = tableQcFilter === 'all' || (tableQcFilter === 'pending' && !isSigned) || (tableQcFilter === 'verified' && isSigned);
          return matchSearch && matchShift && matchQc;
        });
      }, [mandorSubmissions, tableSearch, tableShiftFilter, tableQcFilter]);

      const todayTarget = 30000;
      const todayTotalOutput = useMemo(() => {
        return mandorSubmissions.reduce((sum, s) => sum + (s.batchCount || 0), 0) || 18450;
      }, [mandorSubmissions]);
      const targetPercent = Math.min(100, parseFloat(((todayTotalOutput / todayTarget) * 100).toFixed(1)));

      return (
        <div className="animate-in">
          {/* Top Live Date Context Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'rgba(255,255,255,0.6)', padding: '0.8rem 1.2rem', borderRadius: '1rem', border: '1px solid rgba(15,23,42,0.08)', marginBottom: '1.2rem', flexWrap: 'wrap', gap: '0.6rem' }}>
            <div>
              <span style={{ fontSize: '0.72rem', textTransform: 'uppercase', color: 'var(--text-muted)', fontWeight: 700, letterSpacing: '0.05em' }}>Status Operasional Pabrik</span>
              <div style={{ fontSize: '1.05rem', fontWeight: 800, color: '#030b85' }}>
                <i className="fas fa-calendar-day"></i> Minggu, 26 Juli 2026 · <span style={{ color: '#059669' }}>Shift Pagi (Aktif)</span>
              </div>
            </div>
            <div style={{ display: 'flex', gap: '0.8rem', alignItems: 'center' }}>
              <div style={{ fontSize: '0.8rem', fontWeight: 600, color: 'var(--text-secondary)' }}>
                <i className="fas fa-user-gear" style={{ color: '#030b85' }}></i> Supervisor On Duty: <strong>Hadi (Mandor 1)</strong>
              </div>

              <div style={{ fontSize: '0.75rem', background: 'rgba(16,185,129,0.12)', color: '#059669', padding: '0.3rem 0.8rem', borderRadius: '1.5rem', fontWeight: 800, border: '1px solid rgba(16,185,129,0.3)' }}>
                <i className="fas fa-satellite-dish"></i> Edge Gateway: Connected (Auto-Sync 5s)
              </div>
            </div>
          </div>

          <div className="metrics-grid">
            <div className="metric-card"><div className="metric-label">Total Penghematan</div><div className="metric-value">{formatRupiah(financial.total_savings)}</div><div className="metric-trend up"><i className="fas fa-arrow-up"></i> {financial.savings_trend}%</div></div>
            <div className="metric-card"><div className="metric-label">Grade A Yield</div><div className="metric-value">{quality.grade_a_yield}%</div><div className="metric-trend up"><i className="fas fa-arrow-up"></i> {quality.grade_a_trend}%</div></div>
            <div className="metric-card"><div className="metric-label">Defect Rate</div><div className="metric-value">{quality.defect_rate}%</div><div className="metric-trend down"><i className="fas fa-arrow-down"></i> {Math.abs(quality.defect_trend)}%</div></div>
            
            {/* Expanded OEE Card with Component Sub-bars */}
            <div className="metric-card" style={{ textLeft: 'center' }}>
              <div className="metric-label">OEE Pembakaran</div>
              <div className="metric-value" style={{ color: '#030b85' }}>{operational.oee}%</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '3px', marginTop: '6px', fontSize: '0.65rem', textAlign: 'left' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-secondary)' }}><span>Availability</span><strong>92%</strong></div>
                <div style={{ background: 'rgba(15,23,42,0.08)', height: '4px', borderRadius: '4px' }}><div style={{ width: '92%', background: '#030b85', height: '100%', borderRadius: '4px' }}></div></div>
                <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-secondary)', marginTop: '2px' }}><span>Performance</span><strong>94%</strong></div>
                <div style={{ background: 'rgba(15,23,42,0.08)', height: '4px', borderRadius: '4px' }}><div style={{ width: '94%', background: '#10b981', height: '100%', borderRadius: '4px' }}></div></div>
                <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--text-secondary)', marginTop: '2px' }}><span>Quality</span><strong>97%</strong></div>
                <div style={{ background: 'rgba(15,23,42,0.08)', height: '4px', borderRadius: '4px' }}><div style={{ width: '97%', background: '#f59e0b', height: '100%', borderRadius: '4px' }}></div></div>
              </div>
            </div>

            <div className="metric-card"><div className="metric-label">ROI BRIDGE</div><div className="metric-value">{financial.roi}%</div><div style={{fontSize:'0.7rem',color:'var(--text-muted)'}}>Payback: 3.2 Bulan</div></div>
          </div>

              <div>
                <span style={{ fontSize: '0.72rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)' }}>Progres Target Produksi Harian</span>
                <div style={{ fontSize: '1.1rem', fontWeight: 800, color: '#1e293b' }}>
                  {todayTotalOutput.toLocaleString('id-ID')} / {todayTarget.toLocaleString('id-ID')} unit ({targetPercent}%)
                </div>
              </div>
              <span style={{ fontSize: '0.8rem', background: targetPercent >= 60 ? 'rgba(16,185,129,0.12)' : 'rgba(245,158,11,0.12)', color: targetPercent >= 60 ? '#059669' : '#d97706', padding: '0.3rem 0.8rem', borderRadius: '1.5rem', fontWeight: 700 }}>
                {targetPercent >= 60 ? 'On Track' : 'Di Bawah Target'}

            </div>

              <div style={{ width: `${targetPercent}%`, height: '100%', background: 'var(--primary-gradient)', borderRadius: '10px', transition: 'width 0.6s ease' }}></div>
            </div>
          </div>

            <div style={{fontWeight:600,fontSize:'1rem',minWidth:'100px'}}>BDRI Score</div>

            <div style={{fontWeight:700,fontSize:'1.2rem',minWidth:'50px',textAlign:'right'}}>{Math.round(bdriScore)}%</div>

          </div>

          <div className="charts-row">
            <div className="chart-box" style={{ height: '280px', display: 'flex', flexDirection: 'column' }}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.8rem',flexWrap:'wrap',gap:'0.5rem'}}>
                <h3 style={{fontSize:'0.9rem',fontWeight:700,color:'var(--text-secondary)',margin:0}}>Grade Yield Tren (30 Hari)</h3>
                <select className="grade-select" value={selectedGradeLine} onChange={(e) => setSelectedGradeLine(e.target.value)}>
                  <option value="grade_a">Grade A</option>
                  <option value="grade_b">Grade B</option>
                  <option value="grade_c">Grade C</option>
                  <option value="all">Semua Grade</option>
                </select>
              </div>
              <div style={{ flex: 1, position: 'relative' }}>
                <ChartComponent type="line" data={lineChartInput} options={lineOptions} />
              </div>
            </div>

            <div className="chart-box" style={{ height: '280px', display: 'flex', flexDirection: 'column' }}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.8rem',flexWrap:'wrap',gap:'0.5rem'}}>
                <h3 style={{fontSize:'0.9rem',fontWeight:700,color:'var(--text-secondary)',margin:0}}>Rata-rata Yield per Shift</h3>
                <select className="grade-select" value={selectedGradeBar} onChange={(e) => setSelectedGradeBar(e.target.value)}>
                  <option value="grade_a">Grade A</option>
                  <option value="grade_b">Grade B</option>
                  <option value="grade_c">Grade C</option>
                  <option value="all">Semua Grade</option>
                </select>
              </div>
              <div style={{ flex: 1, position: 'relative' }}>
                <ChartComponent type="bar" data={barChartInput} options={barOptions} />
              </div>
            </div>
          </div>

          <div className="glass-card">
            <h3 style={{fontSize:'0.9rem',fontWeight:700,color:'var(--text-secondary)',marginBottom:'0.8rem'}}><i className="fas fa-fire"></i> Live Kiln Status (Klik untuk Modal Diagnosis AI)</h3>
            <div className="kiln-grid">
              {kiln.map((k,i)=>{
                let c='green',t='Normal';
                if(k.status==='warning'){c='yellow';t='Waspada';}else if(k.status==='critical'){c='red';t='Kritis';}
                return <div key={i} className="glass-card" onClick={() => setSelectedDiagKiln(k)} style={{padding:'1rem',textAlign:'center',cursor:'pointer'}}>
                  <div style={{fontWeight:600,fontSize:'1rem'}}>{k.machine}</div>
                  <div style={{fontSize:'2rem',fontWeight:700,margin:'0.5rem 0'}}>{k.temperature} °C</div>
                  <div><span className={`kiln-status-badge ${c}`}></span> {t}</div>
                  {k.isLive ? (
                    <div style={{fontSize:'0.65rem',color:'#059669',marginTop:'0.3rem'}}><i className="fas fa-satellite-dish"></i> Live dari {k.mandor}</div>
                  ) : (
                    <div style={{fontSize:'0.65rem',color:'var(--text-muted)',marginTop:'0.3rem'}}>Data simulasi</div>
                  )}
                </div>;
              })}
            </div>
          </div>

          {selectedDiagKiln && (
            <div className="modal-overlay" onClick={() => setSelectedDiagKiln(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="close-btn" onClick={() => setSelectedDiagKiln(null)}>&times;</button>
                <h3><i className="fas fa-microchip"></i> Diagnosis & Rekomendasi Preskriptif AI</h3>
                <div className="detail-row"><span>Kiln Mesin</span><strong>{selectedDiagKiln.machine}</strong></div>
                <div className="detail-row"><span>Temperatur Zona</span><strong>{selectedDiagKiln.temperature} °C</strong></div>
                <div className="detail-row"><span>Pusher Speed</span><strong>{selectedDiagKiln.pusherSpeed || 32} RPM</strong></div>
                <div className="detail-row"><span>Status Operasi</span>
                  <strong style={{ color: selectedDiagKiln.status === 'warning' ? '#d97706' : (selectedDiagKiln.status === 'critical' ? '#dc2626' : '#059669') }}>
                    {selectedDiagKiln.status === 'warning' ? "WASPADA" : (selectedDiagKiln.status === 'critical' ? "KRITIS (DEVIASI)" : "NOMINAL OPTIMAL")}
                  </strong>
                </div>
                <div style={{ background: 'rgba(3,11,133,0.03)', border: '1px solid rgba(3,11,133,0.1)', padding: '0.8rem', borderRadius: '0.5rem', marginTop: '1rem', fontSize: '0.8rem' }}>
                  <span style={{ fontWeight: 800, color: '#030b85', display: 'block', marginBottom: '4px' }}>REKOMENDASI KOREKTIF AI:</span>
                  {selectedDiagKiln.temperature > 1300 ? (
                    "Suhu kiln terlalu ekstrem tinggi. Risiko thermal crack besar pada biskuit keramik Grade-A. Rekomendasi: Kurangi flow gas burner 6% dan percepat pusher speed sebesar 2 RPM."
                  ) : selectedDiagKiln.temperature < 1000 ? (
                    "Suhu di bawah standar kematangan keramik standar SNI (underfired). Rekomendasi: Naikkan burner pressure 4% dan perlambat pusher RPM untuk meningkatkan dwell time pembakaran."
                  ) : (
                    "Parameter kiln berada dalam zona optimal pembakaran. Tingkat kematangan Grade A diproyeksikan di atas 90%. Pertahankan rasio feed clay saat ini."
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Submissions Table with Search & Shift Filter */}
          <div className="glass-card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.8rem' }}>
              <h3 style={{fontSize:'0.9rem',fontWeight:700,color:'var(--text-secondary)',margin:0}}><i className="fas fa-clipboard-list"></i> Input Terbaru dari Mandor</h3>
              <div style={{ display: 'flex', gap: '0.6rem', flexWrap: 'wrap', alignItems: 'center' }}>
                <input
                  type="text"
                  placeholder="Cari mandor / catatan..."
                  value={tableSearch}
                  onChange={(e) => setTableSearch(e.target.value)}
                  style={{ padding: '0.35rem 0.8rem', borderRadius: '1.5rem', border: '1px solid rgba(15,23,42,0.12)', fontSize: '0.8rem', outline: 'none', background: 'rgba(255,255,255,0.7)' }}
                />
                <select
                  value={tableShiftFilter}
                  onChange={(e) => setTableShiftFilter(e.target.value)}
                  className="grade-select"
                >
                  <option value="all">Semua Shift</option>
                  <option value="Pagi">Shift Pagi</option>
                  <option value="Siang">Shift Siang</option>
                  <option value="Malam">Shift Malam</option>
                </select>
                <select
                  value={tableQcFilter}
                  onChange={(e) => setTableQcFilter(e.target.value)}
                  className="grade-select"
                >
                  <option value="all">Semua Status QC</option>
                  <option value="pending">QC Pending</option>
                  <option value="verified">QC Verified</option>
                </select>
                <button onClick={handleCsvExport} style={{ padding: '0.35rem 0.85rem', borderRadius: '1.5rem', border: '1px solid rgba(5,150,105,0.3)', background: 'rgba(5,150,105,0.08)', color: '#047857', fontSize: '0.78rem', fontWeight: 800, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: '0.3rem' }}>
                  <i className="fas fa-file-csv"></i> Ekspor CSV
                </button>
              </div>
            </div>

            {(!filteredSubmissions || filteredSubmissions.length===0) ? (
              <div style={{color:'var(--text-muted)',fontSize:'0.85rem',textAlign:'center',padding:'1.5rem'}}>
                <i className="fas fa-folder-open" style={{fontSize:'1.8rem',display:'block',marginBottom:'0.5rem',opacity:0.5}}></i>
                Tidak ditemukan data mandor yang sesuai pencarian/filter.
              </div>
            ) : (
              <div className="table-wrap">
                <table>
                  <thead><tr><th>Waktu</th><th>Mandor</th><th>Mesin</th><th>Shift</th><th>Suhu</th><th>Clay/Feldspar/Quartz</th><th>Pusher</th><th>Batch</th><th>Grade A Yield</th><th>Action QC</th></tr></thead>
                  <tbody>
                    {filteredSubmissions.slice().reverse().slice(0,10).map((s,i)=>(
                      <tr key={i}>
                        <td>{new Date(s.timestamp).toLocaleString('id-ID')}</td>
                        <td><strong>{s.mandor}</strong></td>
                        <td>{s.name}</td>
                        <td><span style={{ fontSize: '0.75rem', background: 'rgba(3,11,133,0.06)', padding: '0.15rem 0.5rem', borderRadius: '1rem', color: '#030b85', fontWeight: 700 }}>{s.shift || 'Pagi'}</span></td>
                        <td>{s.temperature} °C</td>
                        <td>{s.clay}% / {s.feldspar}% / {s.quartz}%</td>
                        <td>{s.pusherSpeed} RPM</td>
                        <td>{s.batchCount} unit</td>
                        <td>
                          <span style={{ fontWeight: 800, color: (s.actualQuality || 88) >= 88 ? '#047857' : '#d97706' }}>
                            {(s.actualQuality || 88.0).toFixed(1)}%
                          </span>
                        </td>
                        <td>
                          <button onClick={() => {
                            setQcModalItem(s);
                            const b = s.batchCount || 100;
                            const q = s.actualQuality || 88;
                            setQcModalReject(Math.max(0, Math.round(b * (1 - q / 100))));
                          }} style={{ padding: '0.25rem 0.6rem', borderRadius: '0.5rem', background: 'rgba(3,11,133,0.08)', border: '1px solid rgba(3,11,133,0.2)', color: '#030b85', fontSize: '0.72rem', fontWeight: 800, cursor: 'pointer' }}>
                            <i className="fas fa-microscope" style={{ marginRight: '0.3rem' }}></i> Input QC
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Modal Interactive Audit Sortir QC */}
          {qcModalItem && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(15,23,42,0.6)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div style={{ background: '#fff', borderRadius: '1.2rem', padding: '1.8rem', width: '100%', maxWidth: '480px', boxShadow: '0 20px 40px rgba(0,0,0,0.2)', border: '1px solid rgba(15,23,42,0.1)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.2rem', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.6rem' }}>
                  <h3 style={{ fontSize: '1rem', fontWeight: 800, color: '#030b85', margin: 0 }}>
                    <i className="fas fa-microscope" style={{ marginRight: '0.4rem' }}></i> Audit Sortir QC Pembakaran
                  </h3>
                  <button onClick={() => setQcModalItem(null)} style={{ background: 'none', border: 'none', fontSize: '1.2rem', color: '#64748b', cursor: 'pointer' }}>&times;</button>
                </div>

                <div style={{ background: 'rgba(15,23,42,0.03)', padding: '0.8rem 1rem', borderRadius: '0.8rem', marginBottom: '1rem', fontSize: '0.78rem', color: '#1e293b' }}>
                  <div><strong>Mandor Bertugas:</strong> {qcModalItem.mandor}</div>
                  <div><strong>Mesin Kiln / Shift:</strong> {qcModalItem.name} ({qcModalItem.shift || 'Pagi'})</div>

    // ---------- PHASE 3 ML COMPONENT ----------
    const Phase3Page = ({ ml, shifts, batchTrace, submissions }) => {
      const [selectedPeriod, setSelectedPeriod] = useState('7d');
      const [predictionResult, setPredictionResult] = useState(null);
      const [loadingPredict, setLoadingPredict] = useState(false);
      const [isSimulation, setIsSimulation] = useState(false);
      const [selectedBatch, setSelectedBatch] = useState(null);
      const [error, setError] = useState('');

      // Simulation States
      const [simTemp, setSimTemp] = useState(1175);
      const [simClay, setSimClay] = useState(50);
      const [simSpeed, setSimSpeed] = useState(32);

      const filterShiftsByPeriod = (period, data) => {
        const now = new Date();
        let cutoff = new Date(now);
        switch(period) {
          case '7d': cutoff.setDate(now.getDate() - 7); break;
          case '1m': cutoff.setMonth(now.getMonth() - 1); break;
          case '3m': cutoff.setMonth(now.getMonth() - 3); break;
          case '6m': cutoff.setMonth(now.getMonth() - 6); break;
          case '1y': cutoff.setFullYear(now.getFullYear() - 1); break;
          default: cutoff.setDate(now.getDate() - 7);
        }
        return data.filter(d => new Date(d.date) >= cutoff);
      };

      const filteredShifts = useMemo(() => filterShiftsByPeriod(selectedPeriod, shifts), [selectedPeriod, shifts]);

      const triggerPredict = async (temp, clay, speed) => {
        setLoadingPredict(true);
        setError('');
        try {
          const res = await fetch('/api/v1/decision/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              temperature: temp,
              clay: clay,
              feldspar: 25,
              quartz: 25,
              pusherSpeed: speed
            })
          });

          if (res.ok) {
            const data = await res.json();
            setPredictionResult({
              clay: clay,
              feldspar: 25,
              quartz: 25,
              predicted_grade_a: data.predicted_grade_a,
              predicted_defect_rate: data.predicted_defect_rate,
              confidence: data.confidence,
              expected_savings: data.expected_savings,
              risk_warning: data.risk_warning
            });
            setIsSimulation(false);
          } else {
            throw new Error('Decision intelligence service failed');
          }
        } catch (e) {
          console.error("DI API connection failed. Falling back to local model.", e);
          setError("Gagal memanggil Decision Intelligence Service. Menggunakan fallback offline.");
          
          let grade_a = 91.5;
          if (temp < 1100 || temp > 1250) grade_a -= Math.abs(temp - 1175) * 0.06;
          if (clay < 45 || clay > 55) grade_a -= Math.abs(clay - 50) * 0.5;
          grade_a = Math.max(60.0, Math.min(98.2, parseFloat(grade_a.toFixed(1))));

          setPredictionResult({
            clay: clay,
            feldspar: 25,
            quartz: 25,
            predicted_grade_a: grade_a,
            predicted_defect_rate: parseFloat(((100 - grade_a)*0.22).toFixed(1)),
            confidence: 93,
            expected_savings: 15000000,
            risk_warning: "Suhu kiln berada di batas deviasi nominal."
          });
          setIsSimulation(true);
        } finally {
          setLoadingPredict(false);
        }
      };

      const handlePredict = () => {
        triggerPredict(simTemp, simClay, simSpeed);
      };

      const loadScenario = (temp, clay, speed) => {
        setSimTemp(temp);
        setSimClay(clay);
        setSimSpeed(speed);
        triggerPredict(temp, clay, speed);
      };

      const data = predictionResult || ml;

      const openBatchDetail = (batch) => {
        const trace = batchTrace.find(t => t.produced === batch.date);
        const detailData = {
          ...batch,
          clay: trace ? parseFloat(trace.raw_material.match(/Clay\s*(\d+)%?/)?.[1]) || ml.clay : ml.clay,
          feldspar: trace ? parseFloat(trace.raw_material.match(/Feldspar\s*(\d+)%?/)?.[1]) || ml.feldspar : ml.feldspar,
          quartz: trace ? parseFloat(trace.raw_material.match(/Quartz\s*(\d+)%?/)?.[1]) || ml.quartz : ml.quartz,
          expected_savings: ml.expected_savings,

              </div>
              <div className="slider-card">
                <div className="slider-header"><span>Rasio Clay (Tanah Liat)</span><span>{simClay} %</span></div>
                <input type="range" min="30" max="70" value={simClay} onChange={(e)=>setSimClay(parseInt(e.target.value))} />

              </div>
              <div className="slider-card" style={{ display: 'flex', flexDirection: 'row', alignItems: 'flex-end', justifyContent: 'flex-end' }}>
                <button className="predict-btn" onClick={handlePredict} disabled={loadingPredict}>
                  {loadingPredict ? <span className="spinner-small"></span> : <><i className="fas fa-robot"></i> Rekomendasi ML</>}
                </button>
              </div>
            </div>
          </div>

          {error && <div style={{ color: '#dc2626', fontWeight: 600, fontSize: '0.85rem', marginTop: '0.5rem' }}>{error}</div>}

          {predictionResult && (
            <div className="decision-container animate-in">
              <div className="decision-header">
                <i className="fas fa-compass"></i> Preskripsi Formula & Rekomendasi ML
              </div>
              
              <div className="decision-grid">
                <div className="decision-field">

                </div>
                <div className="decision-field">
                  <span className="decision-field-label">Defect Rate</span>
                  <span className="decision-field-value" style={{ color: data.predicted_defect_rate > 5 ? '#dc2626' : '#1e293b', fontSize: '1.2rem', fontWeight: 800 }}>{data.predicted_defect_rate}%</span>

                <div className="decision-field">

                  <span className="decision-field-value" style={{ fontWeight: 800 }}>{data.confidence}%</span>

              <div className="decision-field" style={{ background: 'rgba(3, 11, 133, 0.03)', padding: '0.75rem', borderRadius: '0.5rem', border: '1px solid rgba(3,11,133,0.1)', marginTop: '0.5rem' }}>
                <span className="decision-field-label" style={{ color: '#030b85' }}>REKOMENDASI FORMULA BAHAN BAKU</span>
                <span style={{ fontSize: '0.85rem', fontWeight: 700, color: 'var(--text-primary)', marginTop: '2px', display: 'block' }}>
                  Clay: {data.clay}% · Feldspar: {data.feldspar}% · Quartz: {data.quartz}%
                </span>
              </div>
            </div>
          )}

          <div className="glass-card" style={{ marginTop: '1.5rem' }}>
            <h4 style={{color:'var(--text-secondary)',marginBottom:'0.5rem'}}><i className="fas fa-table"></i> Data Batch Harian ({selectedPeriod})</h4>

     // ---------- ALERTS COMPONENT ----------
    const AlertsPage = ({ data, submissions }) => {

        { id: 'alt-default-3', level: 'WARNING', title: 'Fluktuasi Pusher Gearbox RPM', desc: 'Tahanan mesin pusher meningkat +4.2% dari baseline nominal.', time: new Date().toISOString(), machine: 'Machine 2', mandor: 'Samsul', temp: 1180, defaultInst: 'Lakukan pelumasan ulang gearbox pusher speed dan kalibrasi motor encoder.' }
      ]);

      useEffect(() => {
        try {
          localStorage.setItem('bridge_dispatched_tasks', JSON.stringify(dispatchedTasks));

          setAlertsFeed(prev => prev.filter(a => a.id !== id));
          if (selectedAlertItem && selectedAlertItem.id === id) setSelectedAlertItem(null);
        }
      };

      const startEditingAlert = (item) => {

            setLoggedIn(true);
          }
        } catch (e) {
          setOwnerName('Owner');
          setLoggedIn(true);
        }
        setCheckingSession(false);
      }, []);

      const handleOwnerLogin = (name) => {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ name: name || 'Owner', loginAt: new Date().toISOString() }));
        setOwnerName(name || 'Owner');
        setLoggedIn(true);
      };
      const handleOwnerLogout = () => {
        localStorage.removeItem(SESSION_KEY);
        setLoggedIn(false);
        setOwnerName('');
      };

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setToastVisible(true);
      };

      const fetchData = useCallback(async (isInitial = false) => {
        if (isInitial) setSyncState('syncing');
        try {
          const subRes = await fetch('/api/v1/submissions');
          const submissionsData = await subRes.json();
          setSubmissions(submissionsData);

          const kilnRes = await fetch('/api/v1/kilns');
          const kilnsData = await kilnRes.json();
          setKilnLive(kilnsData);

          setSyncState('success');
          const now = new Date();
          setLastSyncTime(now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB');
        } catch (e) {
          console.error("API polling failed. Using dummy local records.", e);
          setSyncState('error');
        }
      }, []);

      useEffect(() => {
        fetchData(true);
        const interval = setInterval(() => {
          fetchData();
        }, 5000);
        return () => clearInterval(interval);
      }, [fetchData]);

      const postSimulatedData = async () => {
        const machines = ["Machine 1", "Machine 2", "Machine 3"];
        const mandors = ["Hadi", "Budi", "Samsul"];
        const machine = machines[Math.floor(Math.random() * machines.length)];
        const mandor = mandors[Math.floor(Math.random() * mandors.length)];
        
        const isCritical = Math.random() < 0.15;
        const temp = isCritical ? (Math.random() < 0.5 ? 1320 : 960) : (1120 + Math.floor(Math.random() * 120));
        
        const clay = 48 + Math.floor(Math.random() * 7);
        const feldspar = 23 + Math.floor(Math.random() * 5);
        const quartz = 100 - clay - feldspar;
        const pusher = 28 + Math.floor(Math.random() * 10);
        const batches = 200 + Math.floor(Math.random() * 80);

        try {
          const res = await fetch('/api/v1/submissions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: machine,
              mandor: mandor,
              temperature: temp,
              clay: clay,
              feldspar: feldspar,
              quartz: quartz,
              pusherSpeed: pusher,
              batchCount: batches,
              notes: "Simulasi pabrik otomatis berjalan",
              signed: true,
              pin: "1234"
            })
          });
          if (res.ok) {
            fetchData();
          }
        } catch (e) {
          console.error("Simulation submit failed:", e);
        }
      };

      const toggleFactorySimulation = () => {
        if (simulating) {
          clearInterval(simIntervalRef.current);
          setSimulating(false);
          triggerToast("Simulasi pabrik dihentikan.");
        } else {
          setSimulating(true);
          triggerToast("Simulasi pabrik dimulai! Mengirim data telemetri otomatis...");
          postSimulatedData();
          simIntervalRef.current = setInterval(() => {
            postSimulatedData();
          }, 3500);
        }
      };

      const handleCsvExport = () => {
        if (!submissions || submissions.length === 0) {
          triggerToast("Belum ada data transaksi logbook untuk diekspor.");
          return;
        }
        const headers = ["Waktu", "Mandor", "Mesin", "Shift", "Suhu_C", "Clay_Pct", "Feldspar_Pct", "Quartz_Pct", "Pusher_RPM", "Batch_Count", "Grade_A_Yield_Pct", "Status_QC", "Catatan"];
        const rows = submissions.map(s => [
          `"${new Date(s.timestamp).toLocaleString('id-ID')}"`,
          `"${s.mandor || 'Hadi'}"`,
          `"${s.name || 'Kiln B'}"`,
          `"${s.shift || 'Pagi'}"`,
          s.temperature || 1150,
          s.clay || 50,
          s.feldspar || 25,
          s.quartz || 25,
          s.pusherSpeed || 30,
          s.batchCount || 100,
          (s.actualQuality || 88.0).toFixed(1),
          s.signed ? "VERIFIED" : "QC PENDING",
          `"${(s.notes || 'Parameter normal').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `BRIDGE_Logbook_Export_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("Data Logbook CSV Berhasil Diunduh!");
      };

      useEffect(() => {
        return () => {
          if (simIntervalRef.current) clearInterval(simIntervalRef.current);
        };
      }, []);

      const handleDemoReset = async () => {
        if (!window.confirm("Apakah Anda yakin ingin me-reset seluruh simulasi demo ke kondisi awal presentasi?")) return;
        setResetting(true);
        try {
          const res = await fetch('/api/v1/demo/reset', { method: 'POST' });
          if (res.ok) {
            triggerToast("Demo reset sukses! Data awal telah di-seed.");
            await fetchData(true);
            setActiveMenu('dashboard');
          } else {
            alert("Gagal mereset database.");
          }
        } catch (err) {
          console.error(err);
          alert("Terjadi masalah koneksi server saat me-reset.");
        } finally {
          setResetting(false);
        }
      };

      const kilnMerged = useMemo(() => {
        return kiln.map(k => {
          const live = kilnLive[k.machine];
          if (!live) return k;
          const t = live.temperature;
          let status = 'normal';
          if (t < 800 || t > 1400) status = 'critical';
          else if (t > 1300) status = 'warning';
          return { ...k, temperature: t, status, isLive: true, updatedAt: live.updatedAt, mandor: live.mandor, pusherSpeed: live.pusherSpeed };
        });
      }, [kiln, kilnLive]);

      // Dynamic inventory levels from Postgres submissions
      const initialStock = { clay: 50000, feldspar: 30000, quartz: 20000 };
      const inventoryStatus = useMemo(() => {
        let clay_used = 0;
        let feldspar_used = 0;
        let quartz_used = 0;

        submissions.forEach(s => {
          const batches = s.batchCount || 100;
          clay_used += (s.clay || 50) * batches * 0.45;
          feldspar_used += (s.feldspar || 25) * batches * 0.45;
          quartz_used += (s.quartz || 25) * batches * 0.45;
        });

        const clayStock = Math.max(2000, initialStock.clay - clay_used);
        const feldsparStock = Math.max(1500, initialStock.feldspar - feldspar_used);
        const quartzStock = Math.max(1000, initialStock.quartz - quartz_used);

        return {
          stock: { clay: Math.round(clayStock), feldspar: Math.round(feldsparStock), quartz: Math.round(quartzStock) },
          consumed: { clay: Math.round(clay_used), feldspar: Math.round(feldspar_used), quartz: Math.round(quartz_used) }
        };
      }, [submissions]);

      const productionProgress = useMemo(() => {
        const total = submissions.reduce((sum, s) => sum + (s.batchCount || 0), 0);
        const target = 30000;
        return {
          total: total,
          target: target,
          percent: Math.min(100, parseFloat(((total / target) * 100).toFixed(1)))
        };
      }, [submissions]);

      const qualityMetrics = useMemo(() => {
        if (submissions.length === 0) return { grade_a: 87.4, defect: 3.2 };
        const avgQuality = submissions.reduce((sum, s) => sum + (s.actualQuality || 88.0), 0) / submissions.length;
        return {
          grade_a: parseFloat(avgQuality.toFixed(1)),
          defect: parseFloat((100 - avgQuality).toFixed(1)) * 0.2
        };
      }, [submissions]);

      const financialMetrics = useMemo(() => {
        const total = submissions.length;
        const totalSavings = total * 380000;
        return {
          total_savings: totalSavings || 12500000,
          savings_trend: 8,
          cogs_per_unit: 8450,
          cogs_trend: -3,
          waste_cost: 8400000,
          cumulative_savings: totalSavings * 1.5,
          roi: 425,
          cogs_reduction: 8.5
        };
      }, [submissions]);

      const carbonMetrics = useMemo(() => {
        let total_co2 = 0;
        submissions.forEach(s => {
          total_co2 += (s.temperature * 0.00015);
        });
        return {
          co2: parseFloat(total_co2.toFixed(1)) || 24.5
        };
      }, [submissions]);

      const activeAlertCount = useMemo(() => {
        let count = 0;
        submissions.forEach(s => {
          if (s.temperature > 1300 || s.clay > 58 || s.temperature < 1000) count++;
        });
        return count || 2;
      }, [submissions]);

      const menuItems = [
        { id:'dashboard', icon:'fa-chart-pie', label:'Dashboard' },
        { id:'financial', icon:'fa-coins', label:'Financial & Cost' },
        { id:'quality', icon:'fa-chart-line', label:'Quality Metrics' },
        { id:'operational', icon:'fa-industry', label:'Operational' },
        { id:'phase3', icon:'fa-brain', label:'Decision Intelligence' },
        { id:'alerts', icon:'fa-exclamation-triangle', label:'Alerts & Anomalies', badge: activeAlertCount },
        { id:'visualization', icon:'fa-chart-bar', label:'Visualisasi' },
        { id:'employee', icon:'fa-users', label:'Employee Performance' },
        { id:'inventory', icon:'fa-boxes', label:'Inventory & Materials' },
        { id:'target', icon:'fa-bullseye', label:'Target & Goals' },
        { id:'sustainability', icon:'fa-leaf', label:'Sustainability' },
        { id:'audit_trail', icon:'fa-file-shield', label:'Audit Trail' },
        { id:'reports', icon:'fa-file-export', label:'Reports Export' },
        { id:'factory_map', icon:'fa-map-location-dot', label:'Factory Map' }
      ];

      const renderContent = () => {
        switch(activeMenu) {
          case 'dashboard': return <DashboardPage financial={financialMetrics} quality={quality} operational={operational} kiln={kilnMerged} shifts={shifts} bdriScore={DUMMY.bdri_score} phase3Unlocked={DUMMY.phase3_unlocked} mandorSubmissions={submissions} simulating={simulating} toggleFactorySimulation={toggleFactorySimulation} handleCsvExport={handleCsvExport} />;
          case 'financial': return <FinancialPage data={financialMetrics} submissions={submissions} />;
          case 'quality': return <QualityPage data={quality} submissions={submissions} />;
          case 'operational': return <OperationalPage data={operational} />;
          case 'phase3': return <Phase3Page ml={ml} shifts={shifts} batchTrace={batchTrace} submissions={submissions} />;
          case 'alerts': return <AlertsPage data={alerts} submissions={submissions} />;
          case 'visualization': return <VisualizationPage bdriScore={DUMMY.bdri_score} phase3Unlocked={DUMMY.phase3_unlocked} complianceScore={DUMMY.compliance_score} shifts={shifts} batchTrace={batchTrace} quality={quality} />;
          case 'employee': return <EmployeePage data={employee} submissions={submissions} />;
          case 'inventory': return <InventoryPage data={inventory} inventoryStatus={inventoryStatus} />;
          case 'target': return <TargetPage productionTarget={productionProgress.percent} qualityTarget={qualityMetrics.grade_a} wasteTarget={DUMMY.waste_reduction_target} achievements={DUMMY.achievements} />;
          case 'sustainability': return <SustainabilityPage data={sustainability} carbonMetrics={carbonMetrics} />;
          case 'audit_trail': return <AuditTrailPage submissions={submissions} />;
          case 'reports': return <ReportsPage submissions={submissions} productionProgress={productionProgress} qualityMetrics={qualityMetrics} inventoryStatus={inventoryStatus} financialMetrics={financialMetrics} triggerToast={triggerToast} />;
          case 'factory_map': return <FactoryMapPage mergedKilns={kilnMerged} />;
          default: return <div>Pilih menu</div>;
        }
      };

      if (checkingSession) return <div className="login-wrap"><span className="spinner-small"></span></div>;
      if (!loggedIn) return <OwnerLoginPage onLogin={handleOwnerLogin} />;

      return (
        <div className="app-layout">
          <Toast message={toastMsg} visible={toastVisible} onHide={() => setToastVisible(false)} />
          {resetting && (
            <div className="reset-overlay">
              <i className="fas fa-rotate fa-spin" style={{ fontSize: '3rem', marginBottom: '1rem', color: '#030b85' }}></i>
              <h2>System Reset in Progress...</h2>
              <p style={{ opacity: 0.8, marginTop: '0.5rem' }}>Clearing transactions and seeding default dataset</p>
            </div>
          )}
          <aside className="sidebar">
            <div className="sidebar-brand">
              <img src="logo-bridge.png" alt="BRIDGE" />
              <span>BRIDGE</span>
            </div>
            <nav className="sidebar-menu">
              {menuItems.map(item => (
                <div key={item.id} className={`menu-item ${activeMenu===item.id?'active':''}`} onClick={()=>setActiveMenu(item.id)} style={{ justifyContent: 'space-between' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                    <i className={`fas ${item.icon}`}></i><span>{item.label}</span>
                  </div>
                  {item.badge > 0 && (
                    <span style={{ fontSize: '0.65rem', background: '#dc2626', color: '#ffffff', padding: '0.15rem 0.5rem', borderRadius: '1rem', fontWeight: 800 }}>
                      {item.badge}
                    </span>
                  )}
                </div>
              ))}
            </nav>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', marginBottom: '0.8rem', padding: '0 0.5rem' }}>
              <button className={`action-btn ${simulating ? 'reset' : ''}`} onClick={toggleFactorySimulation} style={{ width: '100%', justifyContent: 'center' }}>
                <i className={`fas ${simulating ? 'fa-stop fa-spin' : 'fa-play'}`}></i> {simulating ? 'Hentikan Simulasi' : 'Mulai Simulasi Pabrik'}
              </button>
              <button className="action-btn reset" onClick={handleDemoReset} style={{ width: '100%', justifyContent: 'center' }}>
                <i className="fas fa-rotate"></i> Reset Demo Database
              </button>
            </div>
            <div className="sidebar-footer">
              <div style={{fontSize:'0.75rem',color:'var(--text-secondary)',marginBottom:'0.4rem'}}><i className="fas fa-user-circle"></i> {ownerName}</div>
              <div style={{display:'flex',flexDirection:'column',gap:'0.3rem',alignItems:'center',justifyContent:'center'}}>
                <SyncIndicator syncState={syncState} timestamp={lastSyncTime} />
              </div>
              <button className="logout-btn" onClick={handleOwnerLogout}><i className="fas fa-sign-out-alt"></i> Logout</button>
            </div>
          </aside>
          <main className="main-content">{renderContent()}</main>
        </div>
      );
    };

    // ---------- INITIALIZATION AND DUMMY SEED ----------
    function generateDummyShifts() {
      const shifts = [];
      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().slice(0,10);
        const grade_a = 75 + Math.random() * 20;
        const grade_b = 65 + Math.random() * 25;
        const grade_c = 55 + Math.random() * 30;
        const reject = Math.floor(Math.random() * 16);
        const batch = 200 + Math.floor(Math.random() * 100);
        const shiftNames = ["Pagi", "Siang", "Malam"];
        const shift = shiftNames[Math.floor(Math.random() * 3)];
        shifts.push({ 
          date: dateStr, 
          shift, 
          grade_a: parseFloat(grade_a.toFixed(1)), 
          grade_b: parseFloat(grade_b.toFixed(1)),
          grade_c: parseFloat(grade_c.toFixed(1)),
          reject, 
          batch_count: batch 
        });
      }
      return shifts;
    }

    const DUMMY = {
      financial: { total_savings:12500000, savings_trend:8, cogs_per_unit:8450, cogs_trend:-3, waste_cost:8400000, cumulative_savings:187500000, roi:425, cogs_reduction:8.5 },
      quality: { grade_a_yield:87.4, grade_a_trend:5, defect_rate:3.2, defect_trend:-2.1, reject_rate_per_shift:{ Pagi:2.8, Siang:4.1, Malam:5.8 }, first_pass_yield:89.2, rework_rate:4.5 },
      operational: { downtime_per_shift:12, downtime_trend:-15, oee:84.2, throughput_per_shift:890, throughput_trend:6, kiln_efficiency:92.3, cycle_time:45, cycle_trend:-8 },
      ml: { clay:52, feldspar:28, quartz:20, predicted_grade_a:87.4, predicted_defect_rate:3.2, confidence:91, expected_savings:15000000, risk_warning:"Jika suhu zona 2 naik ke 1250°C, reject naik 4.5%" },
      alerts: { anomaly_heatmap:[ {day:'Senin',hour:'08:00',count:3},{day:'Selasa',hour:'14:00',count:5},{day:'Rabu',hour:'20:00',count:2},{day:'Kamis',hour:'10:00',count:4},{day:'Jumat',hour:'16:00',count:6} ], soft_guard_summary:12, hard_guard_summary:3, deviation_alert:"Suhu zona 2 menyimpang 12% - periksa thermocouple!", maintenance_prediction:"Kiln perlu maintenance dalam 3 hari" },
      bdri_score:86.2, phase3_unlocked:true, compliance_score:92, production_target_progress:73, quality_target:87.4, waste_reduction_target:4.2, achievements:["30 hari tanpa anomali"],
      shifts: generateDummyShifts(),
      kiln: [ { machine:"Machine 1", temperature:1150, status:"normal" }, { machine:"Machine 2", temperature:1210, status:"normal" }, { machine:"Machine 3", temperature:1320, status:"warning" } ],
      employee: { scorecard:[ { mandor:"Hadi", grade_a:88, compliance:95, training_need:false }, { mandor:"Budi", grade_a:82, compliance:88, training_need:true }, { mandor:"Samsul", grade_a:85, compliance:92, training_need:false } ], compliance_rate:92, training_need:["Budi"] },
      inventory: { stock:{ clay:4500, feldspar:2800, quartz:3200 }, supplier:[ {name:"Supplier A", quality:92}, {name:"Supplier B", quality:85}, {name:"Supplier C", quality:88} ], material_consumption:{ clay:120, feldspar:75, quartz:60 } },
      sustainability: { carbon_footprint:12.4, energy_consumption:8.2, water_usage:450, waste_reduction_3m:15 },
      batch_traceability: [
        { batch_id:'B001', raw_material:'Clay 50%, Feldspar 25%, Quartz 20%', produced:'2026-07-10', quality:87.4 },
        { batch_id:'B002', raw_material:'Clay 52%, Feldspar 28%, Quartz 18%', produced:'2026-07-09', quality:85.1 },
        { batch_id:'B003', raw_material:'Clay 48%, Feldspar 30%, Quartz 22%', produced:'2026-07-08', quality:82.3 }
      ]
    };

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<Dashboard />);
      console.log('[BRIDGE] Dashboard owner v2 berhasil dirender');
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="color:#dc2626;padding:2rem;text-align:center;"><i class="fas fa-exclamation-triangle"></i> Error: ${err.message}</div>`;
      console.error('[BRIDGE] Render error:', err);
    }
  </script>
</body>
</html>
