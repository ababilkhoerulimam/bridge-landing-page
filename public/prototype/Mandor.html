<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIDGE - Tablet Ops (Mandor)</title>
    <!-- Google Fonts & Icon Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel Dev Standalone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    
    <style>
        :root {
            --bg-body:#eef2f9; 
            --bg-gradient:radial-gradient(circle at 20% 30%, #ffffff, #d7e3f5 70%);
            --primary-gradient:linear-gradient(145deg, #030b85, #1a3ba8);
            --shadow-btn:0 8px 28px rgba(3,11,133,0.3);
            --transition:0.25s ease;
            
            --glass-bg:rgba(255,255,255,0.65); 
            --glass-border:rgba(15,23,42,0.08);
            --glass-blur:blur(18px);
            --text-main:#1e293b;
            --text-secondary:rgba(15,23,42,0.65);
            --text-muted:rgba(15,23,42,0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-body);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            padding: 1.5rem;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphic Container */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 1000px;
            height: 680px;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 30px 60px rgba(30,41,59,0.12),inset 0 1px 0 rgba(255,255,255,0.8);
            position: relative;
            overflow: hidden;
        }

        /* Utility animations */
        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shakeKey 0.4s ease;
        }

        @keyframes shakeKey {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Styled select */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e293b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.2em;
        }

        /* Number Inputs formatting */
        .input-field {
            width: 100%;
            padding: 0.65rem 1rem;
            border: 1px solid rgba(15,23,42,0.12);
            border-radius: 0.8rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            font-family: 'Outfit', sans-serif;
            background: rgba(255, 255, 255, 0.7);
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: #030b85;
            box-shadow: 0 0 0 3px rgba(3, 11, 133, 0.15);
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Badges */
        .status-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .status-badge.nominal { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .status-badge.high { background: rgba(217, 119, 6, 0.15); color: #d97706; }
        .status-badge.low { background: rgba(3, 11, 133, 0.1); color: #030b85; }

        /* Custom Soft Guard Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 1.5rem;
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            box-shadow: 0 25px 50px rgba(30, 41, 59, 0.25);
            text-align: center;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            font-size: 2.8rem;
            color: #d97706;
            margin-bottom: 1rem;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .modal-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.8rem;
        }

        .modal-btn {
            flex: 1;
            padding: 0.8rem;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: var(--transition);
        }

        .modal-btn.confirm {
            background: #d97706;
            color: #fff;
        }

        .modal-btn.confirm:hover {
            background: #b45309;
        }

        .modal-btn.cancel {
            background: #f1f5f9;
            color: var(--text-main);
            border: 1px solid rgba(15, 23, 42, 0.12);
        }

        .modal-btn.cancel:hover {
            background: #e2e8f0;
        }

        /* Timeline style */
        .timeline-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }

        .timeline-item {
            display: flex;
            gap: 0.8rem;
            position: relative;
        }

        .timeline-item::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 18px;
            bottom: -15px;
            width: 2px;
            background: rgba(15,23,42,0.1);
        }

        .timeline-item:last-child::after {
            display: none;
        }

        .timeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-muted);
            border: 3px solid rgba(255,255,255,0.8);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .timeline-dot.active {
            background: #030b85;
            box-shadow: 0 0 10px rgba(3,11,133,0.5);
        }

        .timeline-dot.success {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16,185,129,0.5);
        }

        .timeline-dot.warning {
            background: #d97706;
            box-shadow: 0 0 10px rgba(217,119,6,0.5);
        }

        .timeline-content {
            font-size: 0.78rem;
        }

        .timeline-title {
            font-weight: 700;
            color: var(--text-main);
        }

        .timeline-desc {
            color: var(--text-secondary);
            font-size: 0.72rem;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        const MANDOR_PINS = {
            "Hadi": "1234",
            "Budi": "5678",
            "Samsul": "9012"
        };
        const MANDOR_NAMES = Object.keys(MANDOR_PINS);

        const INITIAL_MACHINES = [
            { id: 'm1', name: 'Machine 1', temperature: 1150, clay: 50, feldspar: 25, quartz: 20, pusherSpeed: 35, batchCount: 120 },
            { id: 'm2', name: 'Machine 2', temperature: 1080, clay: 48, feldspar: 28, quartz: 22, pusherSpeed: 28, batchCount: 98 },
            { id: 'm3', name: 'Machine 3', temperature: 1250, clay: 55, feldspar: 22, quartz: 18, pusherSpeed: 42, batchCount: 145 }
        ];

        // ---------- SYNCHRONIZATION OVERLAY ----------
        const SyncStatusIndicator = ({ syncState }) => {
            let label = "Offline - Local Storage";
            let color = "var(--text-muted)";
            let icon = "fa-cloud-slash";

            if (syncState === "syncing") {
                label = "Menghubungkan ke Server...";
                color = "#030b85";
                icon = "fa-sync fa-spin";
            } else if (syncState === "success") {
                label = "Sinkronisasi Berhasil";
                color = "#10b981";
                icon = "fa-cloud-arrow-up";
            } else if (syncState === "error") {
                label = "Koneksi Bermasalah (Penyimpanan Lokal)";
                color = "#dc2626";
                icon = "fa-triangle-exclamation";
            } else if (syncState === "online") {
                label = "Sistem Online";
                color = "#10b981";
                icon = "fa-circle-check";
            }

            return (
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', fontSize: '0.8rem', color: color, fontWeight: 600 }}>
                    <i className={`fas ${icon}`}></i>
                    <span>{label}</span>
                </div>
            );
        };

        // ---------- LOGIN COMPONENT ----------
        const LoginScreen = ({ onLogin }) => {
            const [selected, setSelected] = useState(MANDOR_NAMES[0]);
            const [pin, setPin] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const submit = async (e) => {
                e.preventDefault();
                setError('');
                if (!selected) { setError('Pilih mandor.'); return; }
                if (pin.length !== 4) { setError('PIN harus 4 digit.'); return; }
                setLoading(true);

                try {
                    const res = await fetch('/api/v1/auth/verify-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mandor: selected, pin: pin })
                    });
                    if (res.ok) {
                        onLogin(selected);
                    } else {
                        const err = await res.json();
                        setError(err.detail || 'PIN salah.');
                        triggerShake();
                    }
                } catch (err) {
                    console.error("Auth server connection failed. Falling back to local offline map.", err);
                    if (MANDOR_PINS[selected] === pin) {
                        onLogin(selected);
                    } else {
                        setError('PIN salah (Server Offline).');
                        triggerShake();
                    }
                } finally {
                    setLoading(false);
                }
            };

            const triggerShake = () => {
                const card = document.querySelector('.glass-card');
                if (card) {
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 400);
                }
            };

            return (
                <div className="animate-in" style={{ maxWidth: '380px', width: '100%', margin: 'auto' }}>
                    <div style={{ textAlign: 'center', marginBottom: '1.8rem' }}>
                        <img src="logo-bridge.png" alt="BRIDGE" style={{ width: '170px', height: 'auto', marginBottom: '0.6rem' }} />
                        <span style={{ display: 'block', fontSize: '0.85rem', fontWeight: 700, color: '#030b85', textTransform: 'uppercase', letterSpacing: '0.1em' }}>
                            Tablet Ops Portal
                        </span>
                        <div style={{ margin: '0.8rem auto 0 auto', padding: '0.45rem 0.8rem', background: 'rgba(3,11,133,0.06)', border: '1px solid rgba(3,11,133,0.18)', borderRadius: '1rem', fontSize: '0.75rem', color: '#030b85', fontWeight: 800, maxWidth: '320px' }}>
                            <i className="fas fa-key" style={{ marginRight: '0.3rem' }}></i> DEMO PIN: Hadi (1234) | Budi (5678) | Samsul (9012)
                        </div>
                    </div>

                    <form onSubmit={submit}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                            <select value={selected} onChange={e => setSelected(e.target.value)} style={{
                                width: '100%', padding: '0.9rem 1rem', background: '#fff', border: '1px solid rgba(15,23,42,0.12)',
                                borderRadius: '2rem', fontSize: '1rem', color: 'var(--text-main)', outline: 'none', cursor: 'pointer', fontWeight: 600
                            }}>
                                {MANDOR_NAMES.map(n => <option key={n} value={n}>{n}</option>)}
                            </select>

                            <input type="password" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                placeholder="PIN Sign-Off (4 digit)" maxLength="4" style={{
                                    width: '100%', padding: '0.9rem 1.2rem', background: '#fff', border: '1px solid rgba(15,23,42,0.12)',
                                    borderRadius: '2rem', fontSize: '1rem', color: 'var(--text-main)', outline: 'none', textAlign: 'center', letterSpacing: '0.2rem'
                                }}
                            />
                            
                            {error && <div style={{ color: '#dc2626', textAlign: 'center', fontSize: '0.9rem', fontWeight: 500 }}>{error}</div>}
                            
                            <button type="submit" disabled={loading} style={{
                                width: '100%', padding: '0.9rem', border: 'none', borderRadius: '3rem', fontSize: '1.05rem', fontWeight: 700,
                                color: '#fff', background: 'var(--primary-gradient)', boxShadow: 'var(--shadow-btn)', cursor: 'pointer',
                                transition: 'var(--transition)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.5rem'
                            }}>
                                {loading ? <span className="spinner"></span> : <><span>Masuk</span><i className="fas fa-arrow-right"></i></>}
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // ---------- CARD INPUT COMPONENT ----------
        const InputCard = ({ label, value, unit, min, max, onChange, status, rangeLabel }) => {
            const handleChange = (e) => {
                const val = parseFloat(e.target.value);
                if (isNaN(val)) onChange(0);
                else onChange(Math.min(max, Math.max(min, val)));
            };

            let statusEl = null;
            if (status === 'nominal') statusEl = <span className="status-badge nominal"><i className="fas fa-check-circle"></i> Nominal</span>;
            else if (status === 'high') statusEl = <span className="status-badge high"><i className="fas fa-arrow-trend-up"></i> Tinggi</span>;
            else if (status === 'low') statusEl = <span className="status-badge low"><i className="fas fa-arrow-trend-down"></i> Rendah</span>;

            return (
                <div style={{ background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(15,23,42,0.08)', borderRadius: '1rem', padding: '1rem', position: 'relative' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                        <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>{label}</span>
                        <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-secondary)', background: 'rgba(15,23,42,0.05)', padding: '0.15rem 0.5rem', borderRadius: '0.25rem' }}>{unit}</span>
                    </div>
                    <input type="number" value={value} onChange={handleChange} className="input-field" min={min} max={max} step="any" />
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.7rem', color: 'var(--text-muted)', marginTop: '6px', fontWeight: 500 }}>
                        <span>{rangeLabel}</span>
                        {statusEl}
                    </div>
                </div>
            );
        };

        // ---------- PREVIEW PANEL ----------
        const SummaryPanel = ({ machine }) => {
            if (!machine) return <div style={{ color: 'var(--text-muted)' }}>Pilih mesin...</div>;
            return (
                <div style={{ background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(15,23,42,0.08)', borderRadius: '1rem', padding: '1.2rem', height: '100%' }}>
                    <h3 style={{ fontSize: '0.85rem', fontWeight: 700, color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '0.8rem', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.5rem' }}>
                        <i className="fas fa-file-invoice"></i> Summary Data
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem', fontSize: '0.85rem' }}>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Nama Mesin:</span><strong style={{ float: 'right' }}>{machine.name}</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Suhu Kiln:</span><strong style={{ float: 'right' }}>{machine.temperature} °C</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Kecepatan Pusher:</span><strong style={{ float: 'right' }}>{machine.pusherSpeed} RPM</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Clay:</span><strong style={{ float: 'right' }}>{machine.clay}%</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Feldspar:</span><strong style={{ float: 'right' }}>{machine.feldspar}%</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Quartz:</span><strong style={{ float: 'right' }}>{machine.quartz}%</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Total Komposisi:</span><strong style={{ float: 'right', color: (machine.clay + machine.feldspar + machine.quartz) > 100 ? '#dc2626' : '#1e293b' }}>{machine.clay + machine.feldspar + machine.quartz}%</strong></div>
                        <div><span style={{ color: 'var(--text-secondary)' }}>Batch Count:</span><strong style={{ float: 'right' }}>{machine.batchCount}</strong></div>
                    </div>
                </div>
            );
        };

        // ---------- MAINTENANCE CALENDAR WIDGET ----------
        const MaintenanceCalendar = () => {
            const [dispatchedTasks, setDispatchedTasks] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('bridge_dispatched_tasks') || '[]');
                } catch(e) { return []; }
            });

            const [defaultTasks, setDefaultTasks] = useState([
                { id: 'def-1', date: 'Hari Ini (26 Jul)', time: '08:00 WIB', task: 'Pembersihan Nozzle Burner & Gas Filter Kiln B', status: 'completed', tech: 'Hadi' },
                { id: 'def-2', date: 'Besok (27 Jul)', time: '14:00 WIB', task: 'Penggantian Pelumas Gearbox Pusher Speed Kiln A', status: 'scheduled', tech: 'Budi' },
                { id: 'def-3', date: 'Rabu (29 Jul)', time: '09:00 WIB', task: 'Kalibrasi Sensor Thermocouple & Suhu Kiln C', status: 'upcoming', tech: 'Samsul' },
            ]);

            useEffect(() => {
                const interval = setInterval(() => {
                    try {
                        const latest = JSON.parse(localStorage.getItem('bridge_dispatched_tasks') || '[]');
                        setDispatchedTasks(latest);
                    } catch(e){}
                }, 2500);
                return () => clearInterval(interval);
            }, []);

            const toggleDispatchedTask = (id) => {
                const updated = dispatchedTasks.map(t => {
                    if (t.id === id) {
                        return { ...t, status: t.status === 'completed' ? 'pending' : 'completed' };
                    }
                    return t;
                });
                setDispatchedTasks(updated);
                try {
                    localStorage.setItem('bridge_dispatched_tasks', JSON.stringify(updated));
                } catch(e){}
            };

            const toggleDefaultTask = (id) => {
                setDefaultTasks(defaultTasks.map(t => t.id === id ? { ...t, status: t.status === 'completed' ? 'scheduled' : 'completed' } : t));
            };

            return (
                <div style={{ background: 'rgba(255,255,255,0.65)', border: '1px solid rgba(3,11,133,0.18)', borderRadius: '1rem', padding: '0.85rem 1rem', marginTop: '0.4rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.6rem', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.4rem' }}>
                        <h4 style={{ fontSize: '0.82rem', fontWeight: 800, color: '#030b85', margin: 0, display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                            <i className="fas fa-brain" style={{ color: '#047857' }}></i> JADWAL SERVIS RUTIN (AI PREDICTIVE MAINTENANCE ENGINE)
                        </h4>
                        <span style={{ fontSize: '0.7rem', background: 'rgba(3,11,133,0.08)', color: '#030b85', padding: '0.15rem 0.6rem', borderRadius: '1rem', fontWeight: 800 }}>
                            <i className="fas fa-robot" style={{ marginRight: '0.3rem' }}></i> Auto-Generated AI
                        </span>
                    </div>
                    
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.45rem' }}>
                        {/* Render Dispatched Tasks from Owner First */}
                        {dispatchedTasks.map(t => {
                            const isDone = t.status === 'completed';
                            return (
                                <div key={t.id} onClick={() => toggleDispatchedTask(t.id)} style={{
                                    display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.55rem 0.75rem', borderRadius: '0.6rem',
                                    background: isDone ? 'rgba(5,150,105,0.08)' : 'rgba(3,11,133,0.06)',
                                    border: isDone ? '1px solid rgba(5,150,105,0.25)' : '1px solid rgba(3,11,133,0.25)',
                                    cursor: 'pointer', transition: 'all 0.2s ease'
                                }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <i className={`fas ${isDone ? 'fa-check-square' : 'fa-square'}`} style={{ fontSize: '0.95rem', color: isDone ? '#047857' : '#030b85' }}></i>
                                        <div>
                                            <div style={{ fontSize: '0.78rem', fontWeight: 800, color: isDone ? '#047857' : '#030b85', textDecoration: isDone ? 'line-through' : 'none' }}>
                                                <i className="fas fa-user-shield" style={{ marginRight: '0.3rem', color: '#030b85' }}></i>
                                                {t.instruction}
                                            </div>
                                            <div style={{ fontSize: '0.68rem', color: '#475569', marginTop: '1px', fontWeight: 600 }}>
                                                <i className="fas fa-clock" style={{ marginRight: '0.2rem' }}></i>Hari Ini · {new Date(t.timestamp).toLocaleTimeString('id-ID', {hour:'2-digit',minute:'2-digit'})} WIB | Mandor: <strong>{t.mandor}</strong> ({t.machine})
                                            </div>
                                        </div>
                                    </div>
                                    <span style={{
                                        fontSize: '0.68rem', fontWeight: 800, padding: '0.15rem 0.55rem', borderRadius: '1rem',
                                        background: isDone ? 'rgba(5,150,105,0.15)' : 'rgba(245,158,11,0.15)',
                                        color: isDone ? '#047857' : '#d97706'
                                    }}>
                                        {isDone ? '✓ SELESAI' : 'INSTRUKSI OWNER'}
                                    </span>
                                </div>
                            );
                        })}

                        {/* Render Default Tasks */}
                        {defaultTasks.map(t => (
                            <div key={t.id} onClick={() => toggleDefaultTask(t.id)} style={{
                                display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.45rem 0.7rem', borderRadius: '0.6rem',
                                background: t.status === 'completed' ? 'rgba(5,150,105,0.06)' : 'rgba(255,255,255,0.85)',
                                border: t.status === 'completed' ? '1px solid rgba(5,150,105,0.2)' : '1px solid rgba(15,23,42,0.08)',
                                cursor: 'pointer', transition: 'all 0.2s ease'
                            }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                    <i className={`fas ${t.status === 'completed' ? 'fa-check-square' : 'fa-square'}`} style={{ fontSize: '0.9rem', color: t.status === 'completed' ? '#047857' : '#94a3b8' }}></i>
                                    <div>
                                        <div style={{ fontSize: '0.78rem', fontWeight: 700, color: t.status === 'completed' ? '#047857' : '#0f172a', textDecoration: t.status === 'completed' ? 'line-through' : 'none' }}>
                                            {t.task}
                                        </div>
                                        <div style={{ fontSize: '0.68rem', color: '#64748b', marginTop: '1px' }}>
                                            <i className="fas fa-clock" style={{ marginRight: '0.2rem' }}></i>{t.date} · {t.time} | Penanggung Jawab: <strong>{t.tech}</strong>
                                        </div>
                                    </div>
                                </div>
                                <span style={{
                                    fontSize: '0.68rem', fontWeight: 800, padding: '0.15rem 0.5rem', borderRadius: '1rem',
                                    background: t.status === 'completed' ? 'rgba(5,150,105,0.12)' : (t.status === 'scheduled' ? 'rgba(245,158,11,0.12)' : 'rgba(3,11,133,0.06)'),
                                    color: t.status === 'completed' ? '#047857' : (t.status === 'scheduled' ? '#d97706' : '#030b85')
                                }}>
                                    {t.status === 'completed' ? '✓ SELESAI' : (t.status === 'scheduled' ? 'TERJADWAL' : 'MENDATANG')}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ---------- MACHINE FORM ----------
        const MachineForm = ({ machine, onUpdate, onSubmit, isSubmitting, onLogout, onHelp }) => {
            const [local, setLocal] = useState({ ...machine });
            const [selectedShift, setSelectedShift] = useState('Pagi');

            useEffect(() => {
                setLocal({ ...machine });
            }, [machine]);

            const handleChange = (key, val) => {
                const updated = { ...local, [key]: val };
                setLocal(updated);
                onUpdate(updated);
            };

            const getStatus = (val, min, max) => {
                if (val < min) return 'low';
                if (val > max) return 'high';
                return 'nominal';
            };

            const tempStatus = getStatus(local.temperature, 800, 1400);
            const clayStatus = getStatus(local.clay, 40, 60);
            const speedStatus = getStatus(local.pusherSpeed, 10, 50);

            const isTempZero = local.temperature === 0;
            const isCompositionOver = (local.clay + local.feldspar + local.quartz) > 100;
            const isBatchZero = local.batchCount <= 0;
            const isHardGuard = isTempZero || isCompositionOver || isBatchZero;

            const handleFormSubmit = () => {
                if (isHardGuard) return;
                onSubmit({ ...local, shift: selectedShift });
            };

            return (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem', height: '100%' }} className="animate-in">
                    <div style={{ fontSize: '0.75rem', fontWeight: 800, color: '#030b85', background: 'rgba(3,11,133,0.06)', padding: '0.45rem 0.8rem', borderRadius: '0.6rem', border: '1px solid rgba(3,11,133,0.15)', display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                        <i className="fas fa-edit"></i> Entry Logbook Parameter Firing Kiln &amp; Formulasi Resep (Awal Shift)
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.8rem' }}>
                        <InputCard label="Temperatur Kiln" value={local.temperature} unit="°C" min={0} max={1600} onChange={v => handleChange('temperature', v)} status={isTempZero ? 'high' : tempStatus} rangeLabel="Rentang: 800-1400°C" />
                        <InputCard label="Kecepatan Pusher" value={local.pusherSpeed} unit="RPM" min={0} max={99} onChange={v => handleChange('pusherSpeed', v)} status={speedStatus} rangeLabel="Rentang: 10-50 RPM" />
                        <InputCard label="Rasio Clay (Tanah Liat)" value={local.clay} unit="%" min={0} max={100} onChange={v => handleChange('clay', v)} status={clayStatus} rangeLabel="Rentang: 40-60%" />
                        <InputCard label="Jumlah Batch" value={local.batchCount} unit="Unit" min={0} max={999} onChange={v => handleChange('batchCount', v)} status={null} rangeLabel="Pencatatan unit produksi" />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.8rem' }}>
                        <div style={{ background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(15,23,42,0.08)', borderRadius: '1rem', padding: '0.8rem 1rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem' }}>
                            <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-secondary)', textTransform: 'uppercase' }}><i className="fas fa-clock"></i> Shift Kerja</span>
                            <select value={selectedShift} onChange={e => setSelectedShift(e.target.value)} style={{
                                flex: 1, padding: '0.4rem 1.5rem 0.4rem 0.8rem', borderRadius: '1.5rem', background: '#fff', border: '1px solid rgba(15,23,42,0.12)', color: 'var(--text-main)', fontWeight: 600, outline: 'none', cursor: 'pointer'
                            }}>
                                <option value="Pagi">Pagi</option>
                                <option value="Siang">Siang</option>
                                <option value="Malam">Malam</option>
                            </select>
                        </div>
                        
                        <div style={{ background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(15,23,42,0.08)', borderRadius: '1rem', padding: '0.8rem 1rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                            <span style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-secondary)', textTransform: 'uppercase' }}>Material Campuran</span>
                            <span style={{ fontSize: '0.85rem', fontWeight: 700 }}>Feldspar {local.feldspar}% / Quartz {local.quartz}%</span>
                        </div>
                    </div>

                    <MaintenanceCalendar />

                    {isTempZero && (
                        <div style={{ background: 'rgba(220,38,38,0.1)', border: '1px solid rgba(220,38,38,0.3)', padding: '0.75rem 1rem', borderRadius: '0.6rem', color: '#dc2626', fontSize: '0.85rem', fontWeight: 700 }}>
                            <i className="fas fa-circle-exclamation"></i> Blokir: Temperatur Kiln terdeteksi 0°C. Silakan masukkan angka termometer sebenarnya.
                        </div>
                    )}
                    {isCompositionOver && (
                        <div style={{ background: 'rgba(220,38,38,0.1)', border: '1px solid rgba(220,38,38,0.3)', padding: '0.75rem 1rem', borderRadius: '0.6rem', color: '#dc2626', fontSize: '0.85rem', fontWeight: 700 }}>
                            <i className="fas fa-circle-exclamation"></i> Blokir: Rasio total bahan baku melebihi 100% (terhitung: {local.clay + local.feldspar + local.quartz}%). Kurangi rasio komposisi.
                        </div>
                    )}
                    {isBatchZero && (
                        <div style={{ background: 'rgba(220,38,38,0.1)', border: '1px solid rgba(220,38,38,0.3)', padding: '0.75rem 1rem', borderRadius: '0.6rem', color: '#dc2626', fontSize: '0.85rem', fontWeight: 700 }}>
                            <i className="fas fa-circle-exclamation"></i> Blokir: Jumlah batch harus lebih besar dari 0.
                        </div>
                    )}

                    <div style={{ display: 'flex', gap: '0.8rem', marginTop: 'auto' }}>
                        <button onClick={handleFormSubmit} disabled={isHardGuard || isSubmitting} style={{
                            flex: 1, padding: '0.8rem 2rem', border: 'none', borderRadius: '3rem', fontSize: '0.95rem', fontWeight: 800,
                            color: '#fff', background: isHardGuard ? '#94a3b8' : 'var(--primary-gradient)',
                            cursor: isHardGuard ? 'not-allowed' : 'pointer', transition: 'var(--transition)', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.5rem',
                            boxShadow: isHardGuard ? 'none' : 'var(--shadow-btn)'
                        }}>
                            {isSubmitting ? <span className="spinner"></span> : <><i className="fas fa-paper-plane"></i> Submit Logbook Batch</>}
                        </button>
                        
                        <button onClick={onHelp} style={{
                            padding: '0.8rem 1.5rem', border: '1px solid rgba(15,23,42,0.12)', borderRadius: '3rem', background: 'transparent',
                            color: 'var(--text-secondary)', cursor: 'pointer', transition: 'var(--transition)', fontWeight: 600
                        }}><i className="fas fa-circle-question"></i> Help</button>
                    </div>
                </div>
            );
        };

        // ---------- SHIFT HANDOVER DIALOG ----------
        const ShiftHandover = ({ data, mandor, onLogout, onBack, syncState, setSyncState }) => {
            const [notes, setNotes] = useState('');
            const [rejectUnits, setRejectUnits] = useState(2);
            const [signPin, setSignPin] = useState('');
            const [signed, setSigned] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const totalBatch = parseInt(data.batchCount) || 100;
            const validReject = Math.max(0, Math.min(totalBatch, parseInt(rejectUnits) || 0));
            const calculatedYield = Math.max(60.0, Math.min(99.0, parseFloat(((totalBatch - validReject) / totalBatch) * 100))).toFixed(1);

            const signOff = async () => {
                setError('');
                if (signPin.length !== 4) { setError('Masukkan PIN 4 digit.'); return; }
                setLoading(true);
                setSyncState("syncing");

                try {
                    const verifyRes = await fetch('/api/v1/auth/verify-pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mandor: mandor, pin: signPin })
                    });
                    if (!verifyRes.ok) {
                        const errData = await verifyRes.json();
                        setError(errData.detail || 'PIN Salah.');
                        setSyncState("error");
                        setLoading(false);
                        return;
                    }

                    const entry = {
                        id: data.id,
                        name: data.name,
                        temperature: parseInt(data.temperature),
                        clay: parseFloat(data.clay),
                        feldspar: parseFloat(data.feldspar),
                        quartz: parseFloat(data.quartz),
                        pusherSpeed: parseFloat(data.pusherSpeed),
                        batchCount: totalBatch,
                        mandor,
                        notes: notes || "Semua parameter normal",
                        timestamp: new Date().toISOString(),
                        signed: true,
                        actualQuality: parseFloat(calculatedYield)
                    };

                    const submitRes = await fetch('/api/v1/submissions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(entry)
                    });

                    if (submitRes.ok) {
                        setSigned(true);
                        setSyncState("success");
                        setError('');
                        setTimeout(() => setSyncState("online"), 3000);
                    } else {
                        throw new Error('API server rejected entry submit');
                    }

                } catch (err) {
                    console.error("Signoff API failed. Saving locally.", err);
                    setError('Masalah koneksi API Server. Data disimpan dalam memori lokal.');
                    setSyncState("error");

                    if (signPin === MANDOR_PINS[mandor]) {
                        const entry = {
                            ...data,
                            mandor,
                            notes: notes || "Semua parameter normal",
                            timestamp: new Date().toISOString(),
                            signed: true,
                            actualQuality: parseFloat(calculatedYield)
                        };
                        const submissions = JSON.parse(localStorage.getItem('bridge_submissions') || '[]');
                        submissions.push(entry);
                        localStorage.setItem('bridge_submissions', JSON.stringify(submissions.slice(-200)));

                        const kilnStatus = JSON.parse(localStorage.getItem('bridge_kiln_status') || '{}');
                        kilnStatus[data.name] = {
                            machine: data.name,
                            temperature: data.temperature,
                            pusherSpeed: data.pusherSpeed,
                            updatedAt: entry.timestamp,
                            mandor
                        };
                        localStorage.setItem('bridge_kiln_status', JSON.stringify(kilnStatus));

                        setSigned(true);
                    } else {
                        setError('PIN Salah.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="animate-in" style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem', height: '100%' }}>
                    <div style={{ fontSize: '0.78rem', fontWeight: 800, color: '#047857', background: 'rgba(5,150,105,0.08)', padding: '0.5rem 0.8rem', borderRadius: '0.6rem', border: '1px solid rgba(5,150,105,0.2)', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                        <i className="fas fa-check-double"></i> Parameter Logbook Disimpan ke Antrean! Silakan Masukkan Hasil Sortir QC Setelah Pembakaran Selesai &amp; Sign-Off PIN
                    </div>

                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.6rem' }}>
                        <button onClick={onBack} disabled={loading} style={{
                            padding: '0.4rem 1rem', borderRadius: '2rem', border: '1px solid rgba(15,23,42,0.12)', background: 'transparent',
                            color: 'var(--text-secondary)', cursor: 'pointer', fontWeight: 600
                        }}><i className="fas fa-arrow-left"></i> Kembali</button>
                        
                        <h2 style={{ fontSize: '1.15rem', fontWeight: 800, color: '#030b85' }}>
                            <i className="fas fa-clipboard-check"></i> Lembar Verifikasi Handover &amp; QC
                        </h2>

                        <button onClick={onLogout} style={{
                            padding: '0.4rem 1rem', borderRadius: '2rem', border: '1px solid rgba(15,23,42,0.12)', background: 'transparent',
                            color: '#dc2626', cursor: 'pointer', fontWeight: 600
                        }}><i className="fas fa-sign-out-alt"></i> Logout</button>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '0.5rem', background: 'rgba(15,23,42,0.03)', padding: '0.8rem 1rem', borderRadius: '0.8rem', border: '1px solid rgba(15,23,42,0.08)' }}>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Mandor:</span><br/><strong style={{ color: '#0f172a' }}>{mandor}</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Shift:</span><br/><strong style={{ color: '#0f172a' }}>{data.shift}</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Mesin Kiln:</span><br/><strong style={{ color: '#0f172a' }}>{data.name}</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Produksi Batch:</span><br/><strong style={{ color: '#0f172a' }}>{data.batchCount} unit</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Suhu Kiln:</span><br/><strong style={{ color: '#0f172a' }}>{data.temperature} °C</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Pusher Speed:</span><br/><strong style={{ color: '#0f172a' }}>{data.pusherSpeed} RPM</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Clay:</span><br/><strong style={{ color: '#0f172a' }}>{data.clay}%</strong></div>
                        <div><span style={{ fontSize: '0.7rem', color: '#64748b' }}>Feldspar / Quartz:</span><br/><strong style={{ color: '#0f172a' }}>{data.feldspar}% / {data.quartz}%</strong></div>
                    </div>

                    {/* Section Input Hasil Sortir QC Pembakaran */}
                    <div style={{ background: 'rgba(3,11,133,0.04)', border: '1px solid rgba(3,11,133,0.15)', padding: '0.8rem 1rem', borderRadius: '0.8rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                            <div style={{ fontSize: '0.78rem', fontWeight: 800, color: '#030b85', textTransform: 'uppercase' }}>
                                <i className="fas fa-microscope" style={{ marginRight: '0.4rem' }}></i> Inspeksi Sortir QC Pembakaran (Kualitas Produk Jadi)
                            </div>
                            <div style={{ fontSize: '0.75rem', color: '#1e293b', marginTop: '3px', fontWeight: 600 }}>
                                Jumlah Cacat / Reject: <strong>{validReject} unit</strong> | Grade A Yield Aktual: <strong style={{ color: '#047857', fontSize: '0.85rem' }}>{calculatedYield}%</strong>
                            </div>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                            <span style={{ fontSize: '0.75rem', fontWeight: 700, color: '#0f172a' }}>Unit Cacat (Reject):</span>
                            <input type="number" min="0" max={totalBatch} value={rejectUnits} onChange={e => setRejectUnits(e.target.value)} disabled={signed || loading} style={{
                                width: '75px', padding: '0.4rem 0.5rem', borderRadius: '0.5rem', border: '1px solid rgba(15,23,42,0.2)', fontWeight: 800, textAlign: 'center', fontSize: '0.95rem', color: '#030b85'
                            }} />
                        </div>
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                        <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#0f172a' }}>Catatan Anomali &amp; Kualitas Shift</label>
                        <textarea value={notes} onChange={e => setNotes(e.target.value)} rows="2" placeholder="Tulis anomali operasi mesin..." style={{
                            padding: '0.6rem 0.8rem', borderRadius: '0.8rem', background: '#fff', border: '1px solid rgba(15,23,42,0.12)',
                            color: 'var(--text-main)', fontFamily: 'inherit', resize: 'none', outline: 'none', fontSize: '0.88rem'
                        }} />
                    </div>

                    <div style={{ display: 'flex', gap: '0.8rem', alignItems: 'center', marginTop: 'auto' }}>
                        <input type="password" value={signPin} onChange={e => setSignPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                            placeholder="PIN Mandor" maxLength="4" disabled={signed || loading} style={{
                                padding: '0.6rem 1rem', borderRadius: '2rem', background: '#fff', border: '1px solid rgba(15,23,42,0.12)',
                                color: 'var(--text-main)', outline: 'none', width: '160px', textAlign: 'center', letterSpacing: '0.25rem', fontWeight: 700
                            }}
                        />
                        
                        <button onClick={signOff} disabled={signed || loading} style={{
                            padding: '0.7rem 2.2rem', borderRadius: '3rem', border: 'none', background: signed ? '#10b981' : 'var(--primary-gradient)',
                            color: '#fff', fontWeight: 700, cursor: signed ? 'not-allowed' : 'pointer', fontFamily: 'inherit',
                            boxShadow: signed ? 'none' : 'var(--shadow-btn)', display: 'flex', alignItems: 'center', gap: '0.5rem'
                        }}>
                            {loading ? <span className="spinner"></span> : (signed ? <><i className="fas fa-check"></i> Transaksi Berhasil Disimpan</> : <><i className="fas fa-signature"></i> Sign-Off &amp; Kirim Data</>)}
                        </button>
                    </div>

                    {error && <div style={{ color: '#dc2626', fontSize: '0.85rem', fontWeight: 700 }}>{error}</div>}
                    {signed && (
                        <div style={{ color: '#047857', fontWeight: 700, display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.88rem', animation: 'fadeIn 0.3s ease' }}>
                            <i className="fas fa-circle-check"></i> Laporan shift &amp; hasil sortir QC berhasil ditandatangani dan disinkronisasi ke server pusat.
                        </div>
                    )}
                </div>
            );
        };

        // ---------- MAIN APPLICATION ----------
        const App = () => {
            const [loggedIn, setLoggedIn] = useState(false);
            const [mandor, setMandor] = useState('');
            const [machines, setMachines] = useState(INITIAL_MACHINES);
            const [selectedId, setSelectedId] = useState('m1');
            const [submitting, setSubmitting] = useState(false);
            const [showHandover, setShowHandover] = useState(false);
            const [submittedData, setSubmittedData] = useState(null);
            const [syncState, setSyncState] = useState("online");
            const [softGuardModal, setSoftGuardModal] = useState({ show: false, warnings: [], data: null });

            const selected = machines.find(m => m.id === selectedId);

            const handleLogin = (name) => {
                setMandor(name);
                setLoggedIn(true);
            };

            const handleLogout = () => {
                setLoggedIn(false);
                setMandor('');
                setShowHandover(false);
                setSubmittedData(null);
            };

            const updateMachine = (updated) => {
                setMachines(prev => prev.map(m => m.id === updated.id ? updated : m));
            };

            const checkSoftGuards = (data) => {
                const warnings = [];
                if (data.temperature > 1300) {
                    warnings.push(`Suhu kiln (${data.temperature}°C) terdeteksi sangat tinggi di atas standar reguler.`);
                }
                if (data.pusherSpeed > 45) {
                    warnings.push(`Kecepatan pendorong pusher (${data.pusherSpeed} RPM) terdeteksi di atas kecepatan optimal.`);
                }

                if (warnings.length > 0) {
                    setSoftGuardModal({ show: true, warnings, data });
                } else {
                    setSubmittedData(data);
                    setShowHandover(true);
                }
            };

            const confirmSoftGuard = () => {
                const data = softGuardModal.data;
                setSoftGuardModal({ show: false, warnings: [], data: null });
                setSubmittedData(data);
                setShowHandover(true);
            };

            const cancelSoftGuard = () => {
                setSoftGuardModal({ show: false, warnings: [], data: null });
            };

            const handleHelp = () => {
                alert(
                    'PETUNJUK LAYAR OPERATOR TABLET (MANDOR)\n\n' +
                    '1. Isi formulir parameter harian untuk mesin terpilih.\n' +
                    '2. Sistem mendeteksi Hard Guard untuk mencegah salah input data (Suhu=0, Komposisi >100%, Batch=0).\n' +
                    '3. Sistem mendeteksi Soft Guard untuk deviasi parameter ekstrim (Suhu >1300°C atau Pusher >45 RPM).\n' +
                    '4. Klik "Submit Batch", isi catatan jika ada anomali, kemudian masukkan PIN untuk verifikasi Sign-Off ke server.'
                );
            };

            const currentStep = useMemo(() => {
                if (!loggedIn) return 0;
                if (signedDataSubmitted) return 5;
                if (showHandover) return 4;
                if (selected && selected.temperature > 0 && selected.clay > 0) return 3;
                if (selectedId) return 2;
                return 1;
            }, [loggedIn, selectedId, selected, showHandover, signedDataSubmitted]);

            const [signedDataSubmitted, setSignedDataSubmitted] = useState(false);
            
            useEffect(() => {
                if (showHandover && syncState === "success") {
                    setSignedDataSubmitted(true);
                } else if (!showHandover) {
                    setSignedDataSubmitted(false);
                }
            }, [showHandover, syncState]);

            if (!loggedIn) {
                return (
                    <div className="glass-card" style={{ justifyContent: 'center', alignItems: 'center' }}>
                        <LoginScreen onLogin={handleLogin} />
                    </div>
                );
            }

            return (
                <div className="glass-card">
                    {/* Soft Guard Modal */}
                    {softGuardModal.show && (
                        <div className="modal-overlay">
                            <div className="modal-content">
                                <i className="fas fa-triangle-exclamation modal-icon"></i>
                                <div className="modal-title">Konfirmasi Penyimpangan</div>
                                <div className="modal-text">
                                    {softGuardModal.warnings.map((w, idx) => (
                                        <p key={idx} style={{ marginBottom: '0.4rem', fontWeight: 600 }}>{w}</p>
                                    ))}
                                    <p style={{ marginTop: '0.8rem', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                                        Apakah Anda yakin parameter ini sudah sesuai dengan kondisi aktual di lapangan?
                                    </p>
                                </div>
                                <div className="modal-actions">
                                    <button className="modal-btn cancel" onClick={cancelSoftGuard}>Periksa Kembali</button>
                                    <button className="modal-btn confirm" onClick={confirmSoftGuard}>Ya, Konfirmasi</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* App Header & Stepper */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.75rem', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
                            <img src="logo-bridge.png" alt="BRIDGE" style={{ height: '24px', width: 'auto' }} />
                            <span style={{ fontSize: '0.9rem', fontWeight: 600, color: 'var(--text-secondary)' }}>
                                Operator: <strong style={{ color: '#030b85' }}>{mandor}</strong>
                            </span>
                        </div>

                        {/* Machine Progress Stepper */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem', background: 'rgba(3,11,133,0.06)', padding: '0.3rem 0.8rem', borderRadius: '1.5rem', border: '1px solid rgba(3,11,133,0.12)' }}>
                            <i className="fas fa-list-check" style={{ color: '#030b85', fontSize: '0.8rem' }}></i>
                            <span style={{ fontSize: '0.75rem', fontWeight: 700, color: '#030b85' }}>
                                Progress Logging: {machines.filter(m => m.temperature > 0).length} / {machines.length} Mesin
                            </span>
                        </div>

                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.8rem' }}>
                            <div style={{ fontSize: '0.72rem', background: 'rgba(16,185,129,0.1)', color: '#059669', padding: '0.2rem 0.6rem', borderRadius: '1rem', fontWeight: 700, display: 'inline-flex', alignItems: 'center', gap: '4px' }}>
                                <i className="fas fa-box-archive"></i> Offline Queue: 0 (Synced)
                            </div>
                            <SyncStatusIndicator syncState={syncState} />
                        </div>
                    </div>

                    {showHandover && submittedData ? (
                        <ShiftHandover data={submittedData} mandor={mandor} onLogout={handleLogout} onBack={() => setShowHandover(false)} syncState={syncState} setSyncState={setSyncState} />
                    ) : (
                        <div style={{ display: 'grid', gridTemplateColumns: '180px 1fr 220px', gap: '1.2rem', flex: 1, minHeight: 0, overflow: 'hidden' }}>
                            {/* Machines Sidebar */}
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem', overflowY: 'auto', borderRight: '1px solid rgba(15,23,42,0.08)', paddingRight: '0.5rem' }}>
                                <div style={{ fontSize: '0.65rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text-secondary)', marginBottom: '0.25rem' }}>
                                    <i className="fas fa-server"></i> Mesin Kiln
                                </div>
                                {machines.map(m => (
                                    <div key={m.id} onClick={() => setSelectedId(m.id)} style={{
                                        padding: '0.75rem 0.8rem', borderRadius: '0.8rem', background: selectedId === m.id ? 'rgba(3,11,133,0.08)' : 'transparent',
                                        border: selectedId === m.id ? '1px solid rgba(3,11,133,0.18)' : '1px solid transparent', cursor: 'pointer', transition: 'var(--transition)'
                                    }}>
                                        <div style={{ fontWeight: 700, fontSize: '0.85rem' }}>{m.name}</div>
                                        <div style={{ fontSize: '0.7rem', color: 'var(--text-secondary)', marginTop: '2px' }}>
                                            Suhu: {m.temperature}°C · Batch: {m.batchCount}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Main Input Form */}
                            <div style={{ overflowY: 'auto', paddingRight: '0.25rem' }}>
                                {selected && <MachineForm machine={selected} onUpdate={updateMachine} onSubmit={checkSoftGuards} isSubmitting={submitting} onLogout={handleLogout} onHelp={handleHelp} />}
                            </div>

                            {/* Summary & Timeline Sidebar */}
                            <div style={{ borderLeft: '1px solid rgba(15,23,42,0.08)', paddingLeft: '0.8rem', display: 'flex', flexDirection: 'column', gap: '1rem', overflowY: 'auto' }}>
                                <SummaryPanel machine={selected} />
                                
                                {/* Production Timeline */}
                                <div style={{ background: 'rgba(255,255,255,0.4)', border: '1px solid rgba(15,23,42,0.08)', borderRadius: '1rem', padding: '1rem' }}>
                                    <h4 style={{ fontSize: '0.75rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-secondary)', borderBottom: '1px solid rgba(15,23,42,0.08)', paddingBottom: '0.4rem', marginBottom: '0.5rem' }}>
                                        <i className="fas fa-route"></i> Shift Timeline
                                    </h4>
                                    <div className="timeline-wrapper">
                                        <div className="timeline-item">
                                            <span className={`timeline-dot ${currentStep >= 1 ? 'success' : ''}`}></span>
                                            <div className="timeline-content">
                                                <div className="timeline-title">Shift Started</div>
                                                <div className="timeline-desc">Operator logged in</div>
                                            </div>
                                        </div>
                                        <div className="timeline-item">
                                            <span className={`timeline-dot ${currentStep >= 2 ? 'success' : ''}`}></span>
                                            <div className="timeline-content">
                                                <div className="timeline-title">Kiln Selected</div>
                                                <div className="timeline-desc">Target machine active</div>
                                            </div>
                                        </div>
                                        <div className="timeline-item">
                                            <span className={`timeline-dot ${currentStep >= 3 ? (selected && (selected.temperature > 1300 || selected.pusherSpeed > 45) ? 'warning' : 'success') : ''}`}></span>
                                            <div className="timeline-content">
                                                <div className="timeline-title">Telemetry Validated</div>
                                                <div className="timeline-desc">
                                                    {selected && (selected.temperature > 1300 || selected.pusherSpeed > 45) ? "Soft guard warning triggered" : "Inputs nominal"}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="timeline-item">
                                            <span className={`timeline-dot ${currentStep >= 4 ? 'success' : ''}`}></span>
                                            <div className="timeline-content">
                                                <div className="timeline-title">Batch Submitted</div>
                                                <div className="timeline-desc">Handover sheet prepared</div>
                                            </div>
                                        </div>
                                        <div className="timeline-item">
                                            <span className={`timeline-dot ${currentStep >= 5 ? 'success' : ''}`}></span>
                                            <div className="timeline-content">
                                                <div className="timeline-title">Digital Sign-off</div>
                                                <div className="timeline-desc">PIN signature verified</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
